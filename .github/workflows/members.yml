name: Kingdom Members

on:
  push:
    paths: ["members/**", ".github/workflows/members.yml"]
  pull_request:
    paths: ["members/**", ".github/workflows/members.yml"]

jobs:
  app:
    name: App (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: members/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: members/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database (schema, seed, security tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the seed is up to date with the prototype data
        run: |
          node members/supabase/scripts/generate-seed.mjs
          git diff --exit-code members/supabase/seed.sql
      - name: Run database tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: members/supabase/tests/run.sh

  e2e:
    name: End-to-end (Supabase + browser)
    runs-on: ubuntu-latest
    needs: [app, database]
    defaults:
      run:
        working-directory: members/app
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      KM_DEV_MAILBOX: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: members/app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (auth, database, API)
        working-directory: members
        # Image pulls are occasionally rate-limited by the registry: retry with a pause before giving up.
        run: |
          for attempt in 1 2 3 4; do
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit,storage-api; then
              exit 0
            fi
            echo "supabase start failed (attempt $attempt); retrying in $((attempt * 30))s"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Export Supabase keys
        working-directory: members
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: members/app/playwright-report
          retention-days: 7
