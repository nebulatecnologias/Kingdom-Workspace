name: Kingdom Members - deploy database

# Applies members/supabase/migrations to the hosted Supabase project and sets its auth rules.
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   the project's reference id (Project settings -> General)
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
# Optional repository variable KM_SITE_URL (e.g. https://members.example.co.za) sets the auth site URL
# and allowed redirects. Without the secrets the job only prints what is missing.

on:
  push:
    branches: [main, claude/ecstatic-faraday-yno7k0]
    paths: ["members/supabase/migrations/**", ".github/workflows/members-supabase-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: members-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations and auth settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: members
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KM_SITE_URL: ${{ vars.KM_SITE_URL }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Supabase deploy skipped. Missing repository secrets:$missing"
            echo "Supabase deploy skipped. Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Link the project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          {
            echo "### Migrations on the hosted project"
            echo '```'
            supabase migration list --password "$SUPABASE_DB_PASSWORD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auth settings (invite-only, link expiry, password length, site URL)
        if: steps.check.outputs.ready == 'true'
        run: |
          # Accounts are created only by the app from invites, so public sign-up stays off.
          body='{"disable_signup":true,"mailer_otp_exp":900,"password_min_length":8'
          if [ -n "$KM_SITE_URL" ]; then
            site="${KM_SITE_URL%/}"
            body="$body,\"site_url\":\"$site\",\"uri_allow_list\":\"$site/**\""
          fi
          body="$body}"
          status=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Auth settings update failed with HTTP $status"
            cat /tmp/auth.json
            exit 1
          fi
          jq '{disable_signup, mailer_otp_exp, password_min_length, site_url, uri_allow_list}' /tmp/auth.json
          {
            echo "### Auth settings"
            echo '```json'
            jq '{disable_signup, mailer_otp_exp, password_min_length, site_url, uri_allow_list}' /tmp/auth.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
