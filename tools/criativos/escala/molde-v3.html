<!DOCTYPE html>
<!-- Molde v3 dos flyers do Escala Previsível: "equação de valor" (referência: anúncio Gaia One).
     Fundo preto, frase curta em cima, peças somadas com +, preço enorme com luz por baixo, marca e garantia no fim.
     Parâmetros na URL:
       f   feed | story
       k   frase de cima (curta, fica em maiúsculas)
       i   peças: icone:rótulo separadas por |   (ícones: livro, play, funil, escudo, oferta, megafone, carrinho, escada, relogio, grafico, telemovel)
       p   número grande (ex.: 325)    u  unidade (ex.: MT)    a  preço riscado (ex.: 947 MT)
       x   linha de baixo (ex.: Acesso imediato · M-Pesa · Garantia de 7 dias)
     Gerado em PNG por tools/criativos/escala/render.mjs. -->
<html lang="pt">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --verde:#00BD36; --verde-claro:#5CF08A; --texto:#F4F8F5; --texto-2:#B7C9BC; --texto-3:#7E9586; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:transparent; }
body{ font-family:'Google Sans','Product Sans',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.flyer{ position:relative; width:1080px; height:1350px; overflow:hidden; color:var(--texto); text-align:center;
  background:radial-gradient(70% 45% at 50% 60%, #06180D 0%, #020504 70%), #020504;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:90px 70px; }
.flyer.story{ height:1920px; padding:260px 70px 300px; }
.kicker{ font-size:44px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; line-height:1.15; max-width:900px; text-wrap:balance; }
.pecas{ margin-top:70px; display:flex; align-items:flex-start; justify-content:center; gap:18px; }
.peca{ width:172px; display:flex; flex-direction:column; align-items:center; gap:18px; }
.tile{ width:172px; height:172px; border-radius:40px; display:grid; place-items:center; position:relative;
  background:linear-gradient(160deg,#16261C,#070D09); box-shadow:inset 0 0 0 1.5px rgba(160,255,190,.22), inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px -18px rgba(0,0,0,.9); }
.tile::after{ content:""; position:absolute; inset:-1px; border-radius:40px; pointer-events:none;
  background:radial-gradient(60% 50% at 50% 0%, rgba(0,189,54,.22), transparent 70%); }
.tile svg{ width:86px; height:86px; color:var(--verde-claro); position:relative; z-index:1; filter:drop-shadow(0 0 14px rgba(0,189,54,.55)); }
.peca span{ font-size:28px; line-height:1.2; color:var(--texto); }
.mais{ margin-top:62px; font-size:56px; font-weight:500; color:var(--texto); width:30px; }
.preco{ position:relative; margin-top:96px; display:flex; align-items:baseline; justify-content:center; gap:20px; }
.preco b{ font-size:330px; font-weight:500; line-height:.8; letter-spacing:-.05em;
  background:linear-gradient(180deg,#FFFFFF 30%,#CFEFD9 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 30px rgba(120,255,160,.35)) drop-shadow(0 0 70px rgba(0,189,54,.25)); }
.preco .u{ font-size:96px; font-weight:500; color:var(--texto); text-shadow:0 0 30px rgba(120,255,160,.4); }
.antes{ margin-top:70px; font-size:34px; color:var(--texto-3); }
.antes s{ text-decoration-thickness:2px; }
.luz{ width:760px; height:60px; margin-top:-14px; background:radial-gradient(50% 50% at 50% 50%, rgba(170,255,200,.85), rgba(0,189,54,.35) 40%, transparent 72%); filter:blur(6px); }
.luz-linha{ width:620px; height:3px; margin-top:-34px; background:linear-gradient(90deg,transparent,#E9FFF0,transparent); border-radius:3px; }
.marca{ margin-top:100px; display:flex; align-items:center; gap:20px; font-size:56px; font-weight:500; letter-spacing:-.02em; }
.marca .selo{ width:76px; height:76px; border-radius:22px; background:#00421F; display:grid; place-items:center; box-shadow:inset 0 0 0 1.5px rgba(0,189,54,.45); }
.marca .selo svg{ width:42px; height:42px; color:var(--verde); }
.linha{ margin-top:22px; font-size:30px; color:var(--texto-2); letter-spacing:.01em; }
.story .kicker{ font-size:50px; }
.story .pecas{ margin-top:100px; }
.story .preco{ margin-top:150px; }
.story .marca{ margin-top:170px; }
</style>
</head>
<body>
<div class="flyer" id="flyer">
  <div class="kicker" id="k"></div>
  <div class="pecas" id="pecas"></div>
  <div class="antes" id="a"></div>
  <div class="preco"><b id="p"></b><span class="u" id="u"></span></div>
  <div class="luz"></div><div class="luz-linha"></div>
  <div class="marca"><span class="selo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h4v-4h4v-4h4V6h4"/></svg></span>Escala Previsível</div>
  <div class="linha" id="x"></div>
</div>
<script>
  var ICONES = {
    livro:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8.5 7.5h7M8.5 11h4.5"/>',
    play:'<rect x="2.5" y="4.5" width="19" height="15" rx="3.5"/><path d="m10 9 5 3-5 3Z" fill="currentColor"/>',
    funil:'<path d="M3 4.5h18l-6.8 8v6.2L9.8 21v-8.5Z"/><path d="M6.4 8.5h11.2"/>',
    escudo:'<path d="M12 21.5s7.5-3.2 7.5-9.5V5.6L12 2.5 4.5 5.6V12c0 6.3 7.5 9.5 7.5 9.5Z"/><path d="m8.8 12 2.3 2.3 4.2-4.6"/>',
    oferta:'<path d="M3.5 12.6V5a1.5 1.5 0 0 1 1.5-1.5h7.6a1.5 1.5 0 0 1 1.1.44l7 7a1.5 1.5 0 0 1 0 2.12l-7.5 7.5a1.5 1.5 0 0 1-2.12 0l-7-7a1.5 1.5 0 0 1-.58-.96Z"/><circle cx="8.5" cy="8.5" r="1.6"/>',
    megafone:'<path d="M3.5 10v4a1.5 1.5 0 0 0 1.5 1.5h2L17 20V4L7 8.5H5A1.5 1.5 0 0 0 3.5 10Z"/><path d="m7.5 15.5 1.3 4.3a1.3 1.3 0 0 0 2.5-.7l-.6-2.4"/><path d="M20.5 9.5v5"/>',
    carrinho:'<path d="M5.6 7h14.2l-1.6 7.6a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.7Z"/><path d="M2.5 3.5h2.2l2.4 12.7"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
    escada:'<path d="M4 19h4v-4h4v-4h4V7h4"/><path d="M16 4h4v4"/>',
    relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    grafico:'<path d="M3 20h18"/><path d="m5 15 4-4 3 3 6-7"/><path d="M14 7h4v4"/>',
    telemovel:'<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/>'
  };
  var q = new URLSearchParams(location.search), f = document.getElementById("flyer");
  var txt = function(id, v){ document.getElementById(id).textContent = v || ""; };
  if(q.get("f") === "story") f.classList.add("story");
  txt("k", q.get("k")); txt("p", q.get("p") || "325"); txt("u", q.get("u") || "MT"); txt("x", q.get("x"));
  var a = q.get("a"); document.getElementById("a").innerHTML = a ? "Antes <s></s>" : ""; if(a) document.querySelector("#a s").textContent = a;
  var pecas = document.getElementById("pecas");
  (q.get("i") || "").split("|").filter(Boolean).forEach(function(par, n){
    var p = par.split(":"), ico = ICONES[p[0]] || ICONES.livro;
    if(n){ var m = document.createElement("div"); m.className = "mais"; m.textContent = "+"; pecas.appendChild(m); }
    var d = document.createElement("div"); d.className = "peca";
    d.innerHTML = '<div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + ico + '</svg></div><span></span>';
    d.querySelector("span").textContent = p.slice(1).join(":");
    pecas.appendChild(d);
  });
</script>
</body>
</html>
