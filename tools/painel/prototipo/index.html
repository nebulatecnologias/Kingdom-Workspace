<title>Painel Kingdom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral branca + área de trabalho lavanda; cartões brancos de cantos largos (como a referência), índigo como base, laranja só em acções */
:root {
  --fundo: #F3F2FA;          /* lavanda muito claro */
  --cartao: #FFFFFF;
  --lateral: #FFFFFF;
  --tinta: #1C1A33;          /* texto principal, índigo quase negro */
  --tinta-2: #5E5B7A;        /* texto secundário */
  --tinta-3: #6A6688;        /* rótulos */
  --linha: #E7E5F3;
  --indigo: #2B2850;
  --indigo-2: #4A4580;
  --lavanda: #B9B3F2;
  --lavanda-suave: #E9E6FC;
  --lavanda-forte: #6359D1;
  --marfim: #FAF9F5;
  --laranja: #FF521A;
  --laranja-texto: #D9400F;
  --sobre-laranja: #1C1A33;
  --verde: #17803F; --verde-suave: #E3F5EA;
  --ambar: #8A5A0E; --ambar-suave: #FDF3DD;
  --vermelho: #B42318; --vermelho-suave: #FCE7E5;
  --sombra: 0 1px 2px rgba(43, 40, 80, .04), 0 8px 24px rgba(43, 40, 80, .06);
  --raio: 20px; --raio-p: 12px;
  --letra: "Google Sans Flex", "Google Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --letra-dados: "Google Sans Flex", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fundo: #14121F; --cartao: #1E1B2E; --lateral: #19172A; --tinta: #F1EFFA; --tinta-2: #B7B3D1; --tinta-3: #A29EC2; --linha: #2E2A45;
  --indigo: #C9C4F6; --indigo-2: #A49DEB; --lavanda: #7B72E0; --lavanda-suave: #2A2645; --lavanda-forte: #A49DEB; --marfim: #1E1B2E;
  --laranja: #FF6A38; --laranja-texto: #FF8A5F; --sobre-laranja: #1C0F08;
  --verde: #4CC285; --verde-suave: #183324; --ambar: #E5B04F; --ambar-suave: #352A14; --vermelho: #F07466; --vermelho-suave: #3A1C1A;
  --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --fundo: #14121F; --cartao: #1E1B2E; --lateral: #19172A; --tinta: #F1EFFA; --tinta-2: #B7B3D1; --tinta-3: #A29EC2; --linha: #2E2A45;
  --indigo: #C9C4F6; --indigo-2: #A49DEB; --lavanda: #7B72E0; --lavanda-suave: #2A2645; --lavanda-forte: #A49DEB; --marfim: #1E1B2E;
  --laranja: #FF6A38; --laranja-texto: #FF8A5F; --sobre-laranja: #1C0F08;
  --verde: #4CC285; --verde-suave: #183324; --ambar: #E5B04F; --ambar-suave: #352A14; --vermelho: #F07466; --vermelho-suave: #3A1C1A;
  --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 400 15px/1.5 var(--letra); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--lavanda-forte); outline-offset: 2px; border-radius: 8px }
.num { font-variant-numeric: tabular-nums }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100% }
.lateral { background: var(--lateral); border-right: 1px solid var(--linha); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto }
.marca { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; font-weight: 600; font-size: 17px }
.marca svg { width: 30px; height: 30px; color: var(--indigo) }
.marca small { display: block; font-weight: 400; font-size: 12px; color: var(--tinta-3) }
.grupo { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); padding: 16px 12px 6px }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--tinta-2); font-weight: 500; min-height: 44px }
.nav a:hover { background: var(--lavanda-suave); color: var(--tinta) }
.nav a[aria-current="page"] { background: var(--indigo); color: #fff }
:root[data-theme="dark"] .nav a[aria-current="page"] { color: #14121F }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav a[aria-current="page"] { color: #14121F } }
.nav .conta { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--laranja); color: var(--sobre-laranja); font-size: 12px; font-weight: 600; display: grid; place-items: center }
.lateral .rodape { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid var(--linha); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--tinta-2) }

.principal { min-width: 0; padding-block: 20px 40px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)) }
.topo { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap }
.topo h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance }
.site { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--cartao); border: 1px solid var(--linha); font-weight: 500 }
.site .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo) }
.pesquisa { flex: 1 1 240px; max-width: 420px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 14px; background: var(--cartao); border: 1px solid var(--linha); color: var(--tinta-3) }
.pesquisa input { border: 0; background: none; outline: none; width: 100%; color: var(--tinta) }
.topo .direita { margin-left: auto; display: flex; align-items: center; gap: 10px }
.redondo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--cartao); border: 1px solid var(--linha); color: var(--tinta-2); position: relative }
.redondo .marca-n { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); border: 2px solid var(--cartao) }
.perfil { display: flex; align-items: center; gap: 10px; font-size: 14px }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--lavanda); color: var(--indigo); flex: none; font-size: 14px }
:root[data-theme="dark"] .avatar { color: #14121F }
.perfil b { display: block; font-weight: 600; line-height: 1.2 }
.perfil small { color: var(--tinta-3) }

.exemplo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ambar); background: var(--ambar-suave); padding: 4px 10px; border-radius: 99px }

/* ---------- peças ---------- */
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 22px; min-width: 0 }
.cartao h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.005em }
.cartao .sub { font-size: 13px; color: var(--tinta-3); margin: 2px 0 0 }
.cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap }
.grelha { display: grid; gap: 20px }
.pilula { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--linha); background: var(--cartao); font-size: 13px; font-weight: 500; color: var(--tinta-2) }
.pilula[aria-pressed="true"] { background: var(--lavanda-suave); border-color: transparent; color: var(--tinta) }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 0; font-weight: 600; font-size: 14px; transition: transform .15s ease, background-color .15s ease }
.botao:active { transform: scale(.98) }
.botao.accao { background: var(--laranja); color: var(--sobre-laranja) }
.botao.accao:hover { filter: brightness(.94) }
.botao.sec { background: var(--cartao); border: 1px solid var(--linha); color: var(--tinta) }
.botao.sec:hover { background: var(--lavanda-suave) }
.botao.peq { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--lavanda-suave); color: var(--indigo-2); white-space: nowrap }
.chip.verde { background: var(--verde-suave); color: var(--verde) }
.chip.ambar { background: var(--ambar-suave); color: var(--ambar) }
.chip.vermelho { background: var(--vermelho-suave); color: var(--vermelho) }
.var { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px }
.var.sobe { color: var(--verde); background: var(--verde-suave) }
.var.desce { color: var(--vermelho); background: var(--vermelho-suave) }

/* ---------- dashboard ---------- */
.boas { background: var(--lavanda-suave); border-radius: var(--raio); padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; position: relative; overflow: hidden }
.boas h2 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em }
.boas p { margin: 0 0 18px; color: var(--tinta-2) }
.boas .pastilhas { display: flex; flex-wrap: wrap; gap: 10px }
.pastilha { display: inline-flex; align-items: center; gap: 10px; background: var(--cartao); border-radius: 12px; padding: 7px 14px 7px 7px; font-size: 14px; font-weight: 500; text-decoration: none }
.pastilha b { min-width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--lavanda-forte); color: #fff; font-size: 14px }
.boas .periodo { display: flex; gap: 6px; background: var(--cartao); padding: 4px; border-radius: 12px; align-self: start }
.boas .periodo button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--tinta-2); min-height: 36px }
.boas .periodo button[aria-pressed="true"] { background: var(--indigo); color: #fff }
:root[data-theme="dark"] .boas .periodo button[aria-pressed="true"] { color: #14121F }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px }
.kpi { display: flex; gap: 14px; align-items: flex-start }
.kpi .ico { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--indigo); color: #fff; flex: none }
:root[data-theme="dark"] .kpi .ico { color: #14121F }
.kpi .ico.lav { background: var(--lavanda-forte); color: #fff }
.kpi small { display: block; font-size: 13px; color: var(--tinta-3) }
.kpi strong { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15 }
.kpi .linha-var { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); margin-top: 4px }

.duas { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
.grafico { width: 100%; height: auto; display: block; overflow: visible }
.grafico text { fill: var(--tinta-3); font: 12px var(--letra-dados) }
.grafico .grelha-l { stroke: var(--linha); stroke-width: 1 }
.legenda { display: flex; gap: 16px; font-size: 13px; color: var(--tinta-2); flex-wrap: wrap }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px }
.dica { position: absolute; pointer-events: none; background: var(--cartao); border: 1px solid var(--linha); box-shadow: var(--sombra); border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%) }
.dica b { display: block; font-size: 15px }
.ref-grafico { position: relative }

.fontes { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center }
.fontes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.fontes li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px }
.fontes li i { width: 10px; height: 10px; border-radius: 50% }
.fontes li span:last-child { color: var(--tinta-3); font-size: 13px; width: 42px; text-align: right }

.lista-barras { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px }
.lista-barras li { display: grid; gap: 6px }
.lista-barras .l1 { display: flex; justify-content: space-between; gap: 10px; font-size: 14px }
.lista-barras .l1 span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lista-barras .l1 span:last-child { color: var(--tinta-2); font-weight: 500 }
.barra { height: 8px; border-radius: 99px; background: var(--lavanda-suave); overflow: hidden }
.barra i { display: block; height: 100%; border-radius: 99px; background: var(--indigo) }
.barra.lav i { background: var(--lavanda-forte) }

.funil { display: grid; gap: 10px }
.funil .etapa { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: 14px }
.funil .etapa .faixa { height: 34px; border-radius: 10px; background: var(--lavanda-suave); position: relative; overflow: hidden }
.funil .etapa .faixa i { position: absolute; inset: 0 auto 0 0; border-radius: 10px; background: var(--indigo) }
.funil .etapa .faixa span { position: relative; z-index: 1; padding-left: 12px; line-height: 34px; color: #fff; font-weight: 600; font-size: 13px }
:root[data-theme="dark"] .funil .etapa .faixa span { color: #14121F }
.funil .etapa .faixa span.fora { color: var(--tinta) !important }
.funil .etapa > span:last-child { color: var(--tinta-3); text-align: right; font-size: 13px }

.accoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.accao { border: 1px solid var(--linha); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center }
.accao .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--lavanda-suave); color: var(--indigo-2); flex: none }
.accao strong { display: block; font-size: 20px; font-weight: 600; line-height: 1.1 }
.accao small { color: var(--tinta-3); font-size: 12px }

table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--tinta-3); padding: 0 10px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap }
td { padding: 12px 10px; border-bottom: 1px solid var(--linha); vertical-align: middle }
tbody tr:hover { background: var(--fundo) }
tbody tr:last-child td { border-bottom: 0 }
.tabela { overflow-x: auto }
td.direita, th.direita { text-align: right }
.url { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--tinta-2) }

.vivo { display: inline-flex; align-items: center; gap: 8px; font-weight: 600 }
.vivo i { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 4px var(--verde-suave) }
@media (prefers-reduced-motion: no-preference) { .vivo i { animation: pulso 2s ease-in-out infinite } }
@keyframes pulso { 50% { box-shadow: 0 0 0 7px transparent } }

/* ---------- inbox ---------- */
.inbox { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 0; height: calc(100vh - 120px); min-height: 560px; padding: 0; overflow: hidden }
.inbox > * { min-width: 0; min-height: 0 }
.col-lista { border-right: 1px solid var(--linha); display: flex; flex-direction: column }
.col-lista .filtros { padding: 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--linha) }
.abas { display: flex; gap: 4px; background: var(--fundo); padding: 4px; border-radius: 12px }
.abas button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--tinta-2); min-height: 36px; white-space: nowrap }
.abas button[aria-pressed="true"] { background: var(--cartao); color: var(--tinta); box-shadow: var(--sombra) }
.abas button em { font-style: normal; color: var(--laranja-texto); margin-left: 4px }
.conversas { overflow-y: auto; flex: 1 }
.conv { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border: 0; background: none; text-align: left; width: 100%; border-bottom: 1px solid var(--linha) }
.conv:hover { background: var(--fundo) }
.conv[aria-current="true"] { background: var(--lavanda-suave) }
.conv .av { position: relative }
.conv .av .canal { position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; background: var(--cartao); display: grid; place-items: center; color: var(--indigo-2); box-shadow: 0 0 0 2px var(--cartao) }
.conv .av .canal svg { width: 12px; height: 12px }
.conv .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.conv .l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.conv .l1 small { color: var(--tinta-3); font-size: 12px; white-space: nowrap }
.conv p { margin: 2px 0 0; font-size: 13px; color: var(--tinta-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.conv.nao-lida p { color: var(--tinta); font-weight: 500 }
.conv .naolida { width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); display: inline-block; margin-left: 6px }

.col-conv { display: flex; flex-direction: column; background: var(--marfim) }
.conv-cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--cartao); border-bottom: 1px solid var(--linha) }
.conv-cab .quem b { display: block; font-weight: 600 }
.conv-cab .quem small { color: var(--tinta-3); font-size: 12px }
.conv-cab .ferr { margin-left: auto; display: flex; gap: 6px }
.icone-b { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--linha); background: var(--cartao); display: grid; place-items: center; color: var(--tinta-2) }
.icone-b:hover { background: var(--lavanda-suave); color: var(--tinta) }
.fio { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px }
.dia-sep { align-self: center; font-size: 12px; color: var(--tinta-3); background: var(--cartao); padding: 3px 12px; border-radius: 99px }
.msg { max-width: 78%; display: grid; gap: 4px }
.msg .bolha { padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5 }
.msg small { font-size: 11px; color: var(--tinta-3) }
.msg.visitante { align-self: flex-start }
.msg.visitante .bolha { background: var(--cartao); border: 1px solid var(--linha); border-top-left-radius: 6px }
.msg.agente { align-self: flex-end; text-align: right }
.msg.agente .bolha { background: var(--indigo); color: #fff; border-top-right-radius: 6px; text-align: left }
:root[data-theme="dark"] .msg.agente .bolha { color: #14121F }
.msg.interna { align-self: flex-end }
.msg.interna .bolha { background: var(--ambar-suave); color: var(--tinta); border: 1px dashed var(--ambar); text-align: left }
.formulario-dados { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--linha) }
.formulario-dados dt { color: var(--tinta-3) }
.formulario-dados dd { margin: 0 }
.compositor { background: var(--cartao); border-top: 1px solid var(--linha); padding: 12px 16px 14px }
.compositor .modos { display: flex; gap: 4px; margin-bottom: 10px }
.compositor .modos button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--tinta-3); min-height: 34px }
.compositor .modos button[aria-pressed="true"] { background: var(--lavanda-suave); color: var(--tinta) }
.compositor .modos button[data-m="comentario"][aria-pressed="true"] { background: var(--ambar-suave); color: var(--ambar) }
.compositor textarea { width: 100%; border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; resize: none; min-height: 72px; background: var(--fundo) }
.compositor.comentario textarea { background: var(--ambar-suave); border-color: var(--ambar) }
.compositor .l2 { display: flex; align-items: center; gap: 6px; margin-top: 10px }
.compositor .l2 .botao { margin-left: auto }
.compositor .via { font-size: 12px; color: var(--tinta-3) }

.col-det { border-left: 1px solid var(--linha); overflow-y: auto; padding: 20px 18px; display: grid; gap: 18px; align-content: start }
.det-topo { text-align: center; display: grid; justify-items: center; gap: 6px }
.det-topo .avatar { width: 64px; height: 64px; font-size: 22px }
.det-topo b { font-size: 16px }
.secao h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-3); margin: 0 0 10px; font-weight: 500 }
.campos { display: grid; gap: 8px; font-size: 13px }
.campos div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px }

.percurso { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--lavanda-suave); display: grid; gap: 10px; font-size: 13px }
.percurso li { position: relative }
.percurso li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lavanda); border: 2px solid var(--cartao) }
.percurso li.chave::before { background: var(--laranja) }

/* ---------- kanban ---------- */
.barra-funil { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px }
.resumo-funil { display: flex; gap: 24px; flex-wrap: wrap; margin-left: auto; font-size: 13px; color: var(--tinta-3) }
.resumo-funil b { display: block; font-size: 18px; color: var(--tinta); font-weight: 600 }
.quadro { display: grid; grid-auto-flow: column; grid-auto-columns: 286px; gap: 16px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity }
.coluna { background: var(--cartao); border-radius: var(--raio); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 420px; scroll-snap-align: start; box-shadow: var(--sombra) }

.col-cab { display: grid; gap: 4px; padding: 2px 4px 8px; border-bottom: 1px solid var(--linha) }

.col-cab .l1 i { width: 10px; height: 10px; border-radius: 50% }

.col-cab .l2 { font-size: 12px; color: var(--tinta-3); display: flex; justify-content: space-between }
.negocio { border: 1px solid var(--linha); border-radius: 14px; padding: 12px 12px 10px; background: var(--cartao); display: grid; gap: 8px; cursor: grab }
.negocio:hover { border-color: var(--lavanda) }
.negocio.arrasta { opacity: .5 }
.negocio .t { font-weight: 600; font-size: 14px; line-height: 1.3 }
.negocio .q { font-size: 12px; color: var(--tinta-3); margin-top: -4px }
.negocio .l3 { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.negocio .valor { font-weight: 600 }
.bant { display: inline-flex; gap: 3px }
.bant i { width: 7px; height: 7px; border-radius: 50%; background: var(--linha) }
.bant i.s { background: var(--verde) }
.negocio .prox { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-2); border-top: 1px solid var(--linha); padding-top: 8px }
.negocio .prox.atraso { color: var(--vermelho) }
.negocio .prox svg { width: 14px; height: 14px }
.negocio .mover { margin-left: auto; border: 0; background: none; color: var(--tinta-3); font-size: 12px; padding: 4px 6px; border-radius: 6px; min-height: 28px }
.negocio .mover:hover { background: var(--lavanda-suave); color: var(--tinta) }

/* ---------- contactos ---------- */
.construtor { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; border: 1px dashed var(--linha); border-radius: 14px; margin-bottom: 16px }
.condicao { display: inline-flex; align-items: center; gap: 6px; background: var(--lavanda-suave); border-radius: 10px; padding: 6px 10px; font-size: 13px }
.condicao b { font-weight: 600 }
.logica { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--tinta-3) }
.pessoa { display: flex; align-items: center; gap: 10px }
.pessoa .avatar { width: 34px; height: 34px; font-size: 12px }
.pessoa b { display: block; font-weight: 600 }
.pessoa small { color: var(--tinta-3); font-size: 12px }

.gaveta-fundo { position: fixed; inset: 0; background: rgba(28, 26, 51, .35); z-index: 40 }

.historico { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px }
.historico li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; font-size: 14px }
.historico .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--lavanda-suave); color: var(--indigo-2) }
.historico small { display: block; color: var(--tinta-3); font-size: 12px }

/* ---------- tarefas ---------- */
.tarefa { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--linha) }

.tarefa input { width: 20px; height: 20px; accent-color: var(--indigo) }
.tarefa b { font-weight: 500; display: block }
.tarefa small { color: var(--tinta-3); font-size: 12px }
.tarefa .quando { font-size: 13px; font-weight: 500; text-align: right }
.tarefa .quando.atraso { color: var(--vermelho) }

.widget form.offline button { min-height: 44px; border: 0; border-radius: 12px; background: #FF521A; color: #1C1A33; font-weight: 600 }

/* ---------- gráficos (SVG à escala) ---------- */
function grafLinhas(el) {
  const W = Math.max(340, Math.round(el.clientWidth || 720)), H = 260, P = { e: 40, d: 12, t: 16, b: 30 };
  const max = Math.ceil(Math.max(...serie.map((s) => s.visitas)) / 50) * 50;
  const x = (i) => P.e + (i / (DIAS - 1)) * (W - P.e - P.d);
  const y = (v) => H - P.b - (v / max) * (H - P.t - P.b);
  const curva = (k) => serie.map((s, i) => {
    const px = x(i), py = y(s[k]);
    if (!i) return `M${px},${py}`;
    const qx = x(i - 1), qy = y(serie[i - 1][k]), cx = (qx + px) / 2;
    return `C${cx},${qy} ${cx},${py} ${px},${py}`;
  }).join(' ');
  const passos = [0, max / 4, max / 2, (3 * max) / 4, max];
  const ultimo = serie[DIAS - 1];
  el.innerHTML = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas e visitantes únicos por dia nos últimos 30 dias">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--lavanda)" stop-opacity=".55"/><stop offset="1" stop-color="var(--lavanda)" stop-opacity="0"/></linearGradient></defs>
    ${passos.map((p) => `<line class="grelha-l" x1="${P.e}" x2="${W - P.d}" y1="${y(p)}" y2="${y(p)}"/><text x="${P.e - 8}" y="${y(p) + 4}" text-anchor="end">${fmt(p)}</text>`).join('')}
    ${serie.map((s, i) => (i % (W < 500 ? 10 : 5) === 0 || i === DIAS - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${s.d.getDate()} ${s.d.toLocaleDateString('pt-PT', { month: 'short' }).replace('.', '')}</text>` : '').join('')}
    <path d="${curva('visitas')} L${x(DIAS - 1)},${H - P.b} L${x(0)},${H - P.b} Z" fill="url(#ga)"/>
    <path d="${curva('visitas')}" fill="none" stroke="var(--lavanda-forte)" stroke-width="2.5"/>
    <path d="${curva('visitantes')}" fill="none" stroke="var(--indigo)" stroke-width="2.5" stroke-dasharray="6 5"/>
    <line id="cursor" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--tinta-3)" stroke-dasharray="3 4" opacity="0"/>
    <circle cx="${x(DIAS - 1)}" cy="${y(ultimo.visitas)}" r="5" fill="var(--lavanda-forte)" stroke="var(--cartao)" stroke-width="2"/>
    <rect x="${P.e}" y="0" width="${W - P.e - P.d}" height="${H}" fill="transparent" id="zona"/>
  </svg><div class="dica" hidden></div>`;
  const svg = el.querySelector('svg'), dica = el.querySelector('.dica'), cur = el.querySelector('#cursor');
  const mostra = (cx) => {
    const r = svg.getBoundingClientRect(); const vx = ((cx - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(DIAS - 1, Math.round(((vx - P.e) / (W - P.e - P.d)) * (DIAS - 1))));
    const s = serie[i]; cur.setAttribute('x1', x(i)); cur.setAttribute('x2', x(i)); cur.setAttribute('opacity', 1);
    dica.hidden = false; dica.style.left = (x(i) / W) * r.width + 'px'; dica.style.top = (y(s.visitas) / H) * r.height + 'px';
    dica.innerHTML = `${s.d.toLocaleDateString('pt-PT', { weekday: 'short', day: 'numeric', month: 'short' })}<b class="num">${fmt(s.visitas)} visitas</b>${fmt(s.visitantes)} visitantes únicos`;
  };
  svg.addEventListener('pointermove', (e) => mostra(e.clientX));
  svg.addEventListener('pointerleave', () => { dica.hidden = true; cur.setAttribute('opacity', 0); });
}

function grafBarras(el) {
  const W = Math.max(300, Math.round(el.clientWidth || 420)), H = 230, P = { e: 34, d: 6, t: 14, b: 28 };
  const max = 450, bw = Math.min(16, Math.floor((W - 40) / 7 / 2) - 4), gw = (W - P.e - P.d) / SEMANA.length;
  const y = (v) => H - P.b - (v / max) * (H - P.t - P.b);
  el.innerHTML = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por dia da semana, computador e telemóvel">
    ${[0, 150, 300, 450].map((p) => `<line class="grelha-l" x1="${P.e}" x2="${W - P.d}" y1="${y(p)}" y2="${y(p)}"/><text x="${P.e - 6}" y="${y(p) + 4}" text-anchor="end">${p}</text>`).join('')}
    ${SEMANA.map(([d, pc, tm], i) => { const cx = P.e + gw * i + gw / 2; return `
      <rect x="${cx - bw - 2}" y="${y(pc)}" width="${bw}" height="${H - P.b - y(pc)}" rx="5" fill="var(--indigo)"><title>${d}: ${pc} no computador</title></rect>
      <rect x="${cx + 2}" y="${y(tm)}" width="${bw}" height="${H - P.b - y(tm)}" rx="5" fill="var(--lavanda)"><title>${d}: ${tm} no telemóvel</title></rect>
      <text x="${cx}" y="${H - 8}" text-anchor="middle">${d}</text>`; }).join('')}
  </svg>`;
}

function donut(el) {
  const total = FONTES.reduce((a, f) => a + f.v, 0), R = 70, r = 46, C = 85;
  let a0 = -Math.PI / 2;
  const arcos = FONTES.map((f) => {
    const a1 = a0 + (f.v / total) * Math.PI * 2, g = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rr, a) => `${C + rr * Math.cos(a)},${C + rr * Math.sin(a)}`;
    const d = `M${p(R, a0)} A${R},${R} 0 ${g} 1 ${p(R, a1 - 0.012)} L${p(r, a1 - 0.012)} A${r},${r} 0 ${g} 0 ${p(r, a0)} Z`;
    a0 = a1; return `<path d="${d}" fill="${f.c}"><title>${f.n}: ${Math.round((f.v / total) * 100)}%</title></path>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 170 170" role="img" aria-label="Fontes de tráfego">${arcos}
      <text x="85" y="80" text-anchor="middle" style="fill:var(--tinta-3);font:12px var(--letra)">Visitas</text>
      <text x="85" y="102" text-anchor="middle" class="num" style="fill:var(--tinta);font:600 20px var(--letra)">${fmt(total)}</text></svg>
    <ul>${FONTES.map((f) => `<li><i style="background:${f.c}"></i><span>${f.n}</span><span class="num">${fmt(f.v)}</span><span class="num">${Math.round((f.v / total) * 100)}%</span></li>`).join('')}</ul>`;
}

V.negocios.depois = () => {
  const move = (id, para) => {
    const n = NEG.find((x) => x.id === id), e = ETAPAS[para];
    if (e.regra && (!n.v || !n.d)) { aviso(`Para mover para «${e.n}» falta preencher: ${!n.v ? 'valor, ' : ''}data de fecho.`, true); return; }
    n.e = para; render(); aviso(`Movido para «${e.n}». Fica registado no histórico.`);
  };
  let arr = null;
  document.querySelectorAll('[data-neg]').forEach((c) => {
    c.addEventListener('dragstart', () => { arr = +c.dataset.neg; c.classList.add('arrasta'); });
    c.addEventListener('dragend', () => c.classList.remove('arrasta'));
  });
  document.querySelectorAll('[data-etapa]').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', () => col.classList.remove('alvo'));
    col.addEventListener('drop', (e) => { e.preventDefault(); col.classList.remove('alvo'); if (arr) move(arr, +col.dataset.etapa); arr = null; });
  });
  document.querySelectorAll('[data-mover]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation(); const n = NEG.find((x) => x.id === +b.dataset.mover); const prox = Math.min(n.e + 1, ETAPAS.length - 1);
    if (prox === n.e) return aviso('Já está na última etapa.'); move(n.id, prox);
  }));
};

  const offline = () => { w.innerHTML = `<div class="w-cab"><span class="avatar" style="width:38px;height:38px;background:#B9B3F2;color:#2B2850">K</span><div><b>Kingdom Company</b><small><i style="background:#8E8BA6"></i>Estamos offline</small></div></div>
    <form class="offline" onsubmit="event.preventDefault()"><p style="margin:0 0 4px;font-size:14px">Neste momento não estamos online. Deixe o seu contacto e respondemos por email.</p>
      <label>Nome<input autocomplete="name"></label><label>Email<input type="email" autocomplete="email"></label><label>Mensagem<textarea rows="2"></textarea></label>
      <label class="cons"><input type="checkbox"> Aceito que a Kingdom Company guarde estes dados para me responder.</label><button>Enviar mensagem</button></form>`; };
  online();
  document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-w]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); (b.dataset.w === 'online' ? online : offline)();
  }));
};

/* ---------- router ---------- */
const TITULOS = { dashboard: 'Dashboard', 'ao-vivo': 'Ao vivo', inbox: 'Inbox', contactos: 'Contactos', negocios: 'Negócios', tarefas: 'Tarefas', widget: 'Chat do site' };
function render() {
  const v = (location.hash.slice(1) || 'dashboard'); const k = V[v] ? v : 'dashboard';
  $('#titulo').textContent = TITULOS[k];
  $('#vista').innerHTML = V[k]();
  document.querySelectorAll('[data-v]').forEach((a) => a.dataset.v === k ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  V[k].depois && V[k].depois();
  document.querySelectorAll('.periodo button, .abas button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.w || b.closest('.compositor')) return;
    b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
}
let tempo;
function aviso(t, erro) {
  document.querySelector('.aviso')?.remove(); clearTimeout(tempo);
  const a = document.createElement('div'); a.className = 'aviso' + (erro ? ' erro' : ''); a.setAttribute('role', 'status'); a.textContent = t;
  document.body.appendChild(a); tempo = setTimeout(() => a.remove(), 3600);
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
