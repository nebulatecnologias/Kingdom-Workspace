<title>Painel Kingdom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..500&display=swap">
<style>
/* Mundo: o painel da Kingdom Academy (lona de pedra quente, cartões brancos de 22px, pílulas, Google Sans 400/500)
   com só duas cores de marca: índigo (dados, selecção, texto forte) e laranja (a única acção e o que pede atenção). */
:root {
  --lona: #F5F3F0; --lona-2: #EFECE8; --cartao: #FFFFFF; --cartao-2: #FBFAF8; --fundo-baixo: #F1EEEA;
  --linha: #E8E3DD; --linha-forte: #D9D3CB;
  --tinta: #1E1C33; --tinta-2: #3B3852; --suave: #66627A;
  --indigo: #2B2850; --sobre-indigo: #FFFFFF;
  --indigo-6: rgba(43, 40, 80, .06); --indigo-12: rgba(43, 40, 80, .12); --indigo-24: rgba(43, 40, 80, .24); --indigo-48: rgba(43, 40, 80, .48);
  --laranja: #FF521A; --sobre-laranja: #1C1A17; --laranja-suave: #FFF0E9; --laranja-tinta: #B23C08;
  --verde-suave: #E3F6EA; --verde-tinta: #0F7A37; --vermelho-suave: #FDE8EA; --vermelho-tinta: #B4202D;
  --vivo: #15803D;
  --sombra-1: 0 1px 2px rgba(28, 22, 16, .05), 0 6px 18px -8px rgba(28, 22, 16, .10);
  --sombra-2: 0 2px 6px rgba(28, 22, 16, .06), 0 18px 40px -16px rgba(28, 22, 16, .22);
  --sombra-pop: 0 12px 32px -8px rgba(28, 22, 16, .28), 0 2px 8px rgba(28, 22, 16, .08);
  --anel: 0 0 0 3px rgba(255, 82, 26, .28);
  --letra: "Google Sans Flex", "Google Sans", "Product Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --lona: #141311; --lona-2: #191816; --cartao: #1E1C19; --cartao-2: #1B1917; --fundo-baixo: #26231F;
  --linha: #2E2B27; --linha-forte: #3D3934; --tinta: #F4F0EA; --tinta-2: #D6D1CA; --suave: #A6A097;
  --indigo: #B3ADF0; --sobre-indigo: #16142B;
  --indigo-6: rgba(179, 173, 240, .07); --indigo-12: rgba(179, 173, 240, .14); --indigo-24: rgba(179, 173, 240, .26); --indigo-48: rgba(179, 173, 240, .5);
  --laranja-suave: #3A2216; --laranja-tinta: #FF9A6B; --verde-suave: #16301F; --verde-tinta: #6FD39A; --vermelho-suave: #3A1A1D; --vermelho-tinta: #F28B95; --vivo: #4CC285;
  --sombra-1: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -8px rgba(0, 0, 0, .5);
  --sombra-2: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 40px -16px rgba(0, 0, 0, .6);
  --sombra-pop: 0 12px 32px -8px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .4);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --lona: #141311; --lona-2: #191816; --cartao: #1E1C19; --cartao-2: #1B1917; --fundo-baixo: #26231F;
  --linha: #2E2B27; --linha-forte: #3D3934; --tinta: #F4F0EA; --tinta-2: #D6D1CA; --suave: #A6A097;
  --indigo: #B3ADF0; --sobre-indigo: #16142B;
  --indigo-6: rgba(179, 173, 240, .07); --indigo-12: rgba(179, 173, 240, .14); --indigo-24: rgba(179, 173, 240, .26); --indigo-48: rgba(179, 173, 240, .5);
  --laranja-suave: #3A2216; --laranja-tinta: #FF9A6B; --verde-suave: #16301F; --verde-tinta: #6FD39A; --vermelho-suave: #3A1A1D; --vermelho-tinta: #F28B95; --vivo: #4CC285;
  --sombra-1: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -8px rgba(0, 0, 0, .5);
  --sombra-2: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 40px -16px rgba(0, 0, 0, .6);
  --sombra-pop: 0 12px 32px -8px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .4);
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--lona); color: var(--tinta); font: 400 15px/1.5 var(--letra); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit; text-underline-offset: 3px }
::selection { background: rgba(255, 82, 26, .28) }
:focus-visible { outline: none; box-shadow: var(--anel) }
h1, h2, h3 { font-weight: 500; margin: 0; text-wrap: balance }
.num { font-variant-numeric: tabular-nums }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
* { scrollbar-width: thin; scrollbar-color: var(--linha-forte) transparent }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100% }
.lateral { background: var(--lona-2); border-right: 1px solid var(--linha); padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto }
.marca { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; text-decoration: none }
.marca .simbolo { width: 34px; height: 34px; border-radius: 11px; background: var(--indigo); color: var(--sobre-indigo); display: grid; place-items: center }
.marca .simbolo svg { width: 20px; height: 20px }
.marca b { display: block; font-weight: 500; font-size: 16px; letter-spacing: -.015em }
.marca small { display: block; font-size: 12.5px; color: var(--suave) }
.grupo { font-size: 12.5px; color: var(--suave); padding: 16px 12px 6px }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: var(--tinta-2); font-weight: 500; min-height: 44px; transition: background-color .15s var(--ease) }
.nav a:hover { background: var(--fundo-baixo) }
.nav a[aria-current="page"] { background: var(--cartao); color: var(--tinta); box-shadow: var(--sombra-1) }
.nav a[aria-current="page"] svg { color: var(--laranja) }
.conta { margin-left: auto; min-width: 24px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--laranja-suave); color: var(--laranja-tinta); font-size: 12.5px; font-weight: 500; display: inline-grid; place-items: center }
.ponto-vivo { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--suave) }
.ponto-vivo i, .vivo-i { width: 8px; height: 8px; border-radius: 50%; background: var(--vivo); display: inline-block }
.lateral .pe { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--linha) }

.principal { min-width: 0; padding-block: 22px 64px; padding-left: max(clamp(16px, 3vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 40px), env(safe-area-inset-right, 0px)) }
.topo { display: flex; align-items: center; gap: 12px; margin-bottom: 26px }
.pesquisa { flex: 0 1 420px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--cartao); border: 1px solid var(--linha); color: var(--suave) }
.pesquisa input { border: 0; background: none; outline: none; width: 100%; color: var(--tinta) }
.pesquisa input::placeholder { color: var(--suave) }
.site { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--cartao); border: 1px solid var(--linha); font-weight: 500; color: var(--tinta-2) }
.topo .direita { margin-left: auto; display: flex; align-items: center; gap: 10px }
.marca-prot { font-size: 12.5px; color: var(--suave); padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--linha-forte) }
.b-icone { width: 44px; height: 44px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--cartao); border: 1px solid var(--linha); color: var(--tinta-2); position: relative; transition: background-color .15s var(--ease) }
.b-icone:hover { background: var(--cartao-2); border-color: var(--linha-forte) }
.b-icone .sinal { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); box-shadow: 0 0 0 2px var(--cartao) }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 500; font-size: 14px; background: var(--indigo-12); color: var(--tinta); flex: none }
.cabeca-pag { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap }
.cabeca-pag h1 { font-size: clamp(26px, 3.2vw, 34px); letter-spacing: -.025em; line-height: 1.2 }
.cabeca-pag p { margin: 6px 0 0; color: var(--suave); max-width: 60ch }

/* ---------- peças ---------- */
.cartao { background: linear-gradient(180deg, var(--cartao), var(--cartao-2)); border: 1px solid var(--linha); border-radius: 22px; box-shadow: var(--sombra-1); padding: 22px; min-width: 0 }
.cartao > h2, .cab h2 { font-size: 17px; letter-spacing: -.015em; line-height: 1.3 }
.cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap }
.cab p { margin: 2px 0 0; font-size: 13.5px; color: var(--suave) }
.grelha { display: grid; gap: 18px }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font-weight: 500; font-size: 14px; white-space: nowrap; text-decoration: none; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease) }
.botao:active { transform: translateY(1px) }
.botao.accao { background: linear-gradient(180deg, #FF7A45, var(--laranja)); color: var(--sobre-laranja); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px -4px rgba(226, 78, 12, .5) }
.botao.accao:hover { background: linear-gradient(180deg, #FF8B5A, #FF6630) }
.botao.fantasma { background: var(--cartao); border-color: var(--linha); color: var(--tinta) }
.botao.fantasma:hover { background: var(--cartao-2); border-color: var(--linha-forte) }
.botao.calmo { background: none; color: var(--tinta-2) }
.botao.calmo:hover { background: var(--fundo-baixo) }
.botao.peq { height: 34px; padding: 0 14px; font-size: 13.5px }
.segmentos { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--fundo-baixo) }
.segmentos button { border: 0; background: none; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--tinta-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px }
.segmentos button[aria-pressed="true"] { background: var(--cartao); color: var(--tinta); box-shadow: var(--sombra-1) }
.pilula { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--fundo-baixo); color: var(--tinta-2); white-space: nowrap }
.pilula svg.i { width: 14px; height: 14px }
.pilula.indigo { background: var(--indigo-12); color: var(--tinta) }
.pilula.laranja { background: var(--laranja-suave); color: var(--laranja-tinta) }
.pilula.verde { background: var(--verde-suave); color: var(--verde-tinta) }
.pilula.vermelho { background: var(--vermelho-suave); color: var(--vermelho-tinta) }
.delta { font-size: 12.5px; font-weight: 500 }
.delta.sobe { color: var(--verde-tinta) }
.delta.desce { color: var(--vermelho-tinta) }
.delta.neutro { color: var(--suave) }

/* ---------- dashboard ---------- */
.saudacao { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: center }
.saudacao h1 { font-size: clamp(26px, 3.2vw, 34px); letter-spacing: -.025em; line-height: 1.2 }
.saudacao p { margin: 6px 0 16px; color: var(--suave) }
.atalhos { display: flex; flex-wrap: wrap; gap: 10px }
.atalho { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 16px 0 6px; border-radius: 999px; background: var(--cartao); border: 1px solid var(--linha); text-decoration: none; font-weight: 500; font-size: 14px; box-shadow: var(--sombra-1); transition: transform .2s var(--ease), box-shadow .2s var(--ease) }
.atalho:hover { transform: translateY(-2px); box-shadow: var(--sombra-2) }
.atalho b { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; display: grid; place-items: center; font-weight: 500; background: var(--indigo); color: var(--sobre-indigo) }
.atalho.urgente b { background: var(--laranja); color: var(--sobre-laranja) }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px }
.kpi { padding: 18px 20px 20px; display: grid; gap: 14px; align-content: space-between }
.kpi-rot { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tinta-2) }
.kpi-linha { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px }
.kpi-valor { font-size: 38px; font-weight: 500; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap }
.kpi-valor small { font-size: 18px; letter-spacing: -.01em; color: var(--tinta-2) }
.barras { display: flex; align-items: flex-end; gap: 4px; height: 38px; flex: none }
.barras i { width: 7px; border-radius: 4px; background: var(--indigo-24) }
.barras i:last-child { background: var(--laranja) }

.principal-graf { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px }
.grafico { width: 100%; height: auto; display: block; overflow: visible }
.grafico text { fill: var(--suave); font: 12px var(--letra); font-variant-numeric: tabular-nums }
.grafico .gl { stroke: var(--linha); stroke-width: 1 }
.legenda { display: flex; gap: 16px; font-size: 13px; color: var(--tinta-2); flex-wrap: wrap; align-items: center }
.legenda .amostra { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0 }
.ref-graf { position: relative }
.dica { position: absolute; pointer-events: none; background: var(--cartao); box-shadow: var(--sombra-pop); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); color: var(--tinta-2); z-index: 5 }
.dica b { display: block; font-size: 15px; font-weight: 500; color: var(--tinta) }
details.numeros { margin-top: 10px; font-size: 13.5px; color: var(--suave) }
details.numeros summary { cursor: pointer; width: max-content; border-radius: 8px }

.agora { display: grid; gap: 14px; align-content: start }
.agora .grande { display: flex; align-items: baseline; gap: 10px }
.agora .grande strong { font-size: 38px; font-weight: 500; letter-spacing: -.03em; line-height: 1 }
.agora ul { list-style: none; margin: 0; padding: 0; display: grid }
.agora li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--linha); font-size: 13.5px }
.agora li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2) }
.agora li span:last-child { color: var(--suave) }

.duas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px }

table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--suave); padding: 0 10px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap }
td { padding: 12px 10px; border-bottom: 1px solid var(--linha); vertical-align: middle }
tbody tr { transition: background-color .15s var(--ease) }
tbody tr:hover { background: var(--fundo-baixo) }
tbody tr:last-child td { border-bottom: 0 }
th:first-child, td:first-child { padding-left: 0 }
th:last-child, td:last-child { padding-right: 0 }
.d { text-align: right; white-space: nowrap }
.tabela { overflow-x: auto }
.url { font-family: var(--mono); font-size: 12.5px; color: var(--suave); overflow-wrap: anywhere }
.barra-celula { display: grid; grid-template-columns: minmax(60px, 1fr) 52px; align-items: center; gap: 10px }
.trilho { height: 8px; border-radius: 999px; background: var(--fundo-baixo); overflow: hidden; display: block }
.trilho i { display: block; height: 100%; border-radius: 999px; background: var(--indigo) }

.lista-accoes { list-style: none; margin: 0; padding: 0; display: grid }
.lista-accoes li { display: grid; grid-template-columns: 36px minmax(0, 1fr) 56px 110px; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--linha) }
.lista-accoes li:first-child { border-top: 0 }
.lista-accoes .ic { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: var(--indigo-6); color: var(--tinta-2) }
.lista-accoes .n { font-weight: 500; text-align: right }

.funil { display: grid; gap: 4px }
.funil .passo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center }
.funil .passo .nome { font-size: 14px; color: var(--tinta-2) }
.funil .passo .val { font-weight: 500 }
.funil .passo .trilho { grid-column: 1 / -1; height: 12px }
.funil .passo.fim .trilho i { background: var(--laranja) }
.funil .taxa { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--suave); padding: 6px 0 6px 2px }
.funil .taxa svg { width: 14px; height: 14px }
.funil .taxa b { font-weight: 500; color: var(--tinta-2) }

.dividida { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 3px; margin: 6px 0 12px }
.dividida i { display: block; height: 100% }
.dividida i:nth-child(1) { background: var(--indigo) } .dividida i:nth-child(2) { background: var(--indigo-48) } .dividida i:nth-child(3) { background: var(--indigo-24) }
.leg-div { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--tinta-2) }
.leg-div span { display: inline-flex; align-items: center; gap: 7px }
.leg-div i { width: 10px; height: 10px; border-radius: 3px }
.paises { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px }
.paises li { display: grid; grid-template-columns: 110px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 14px }
.paises li span:last-child { text-align: right; color: var(--tinta-2) }

/* ---------- ao vivo ---------- */
.pessoa { display: flex; align-items: center; gap: 10px; min-width: 0 }
.pessoa .avatar { width: 34px; height: 34px; font-size: 12.5px }
.avatar.anon { background: var(--fundo-baixo); color: var(--suave) }
.pessoa b { display: block; font-weight: 500; white-space: nowrap }
.pessoa small { color: var(--suave); font-size: 12.5px }

/* ---------- inbox ---------- */
.inbox { display: grid; grid-template-columns: 312px minmax(0, 1fr) 300px; height: calc(100vh - 140px); min-height: 580px; padding: 0; overflow: hidden }
.inbox > * { min-width: 0; min-height: 0 }
.col-lista { border-right: 1px solid var(--linha); display: flex; flex-direction: column }
.col-lista .filtros { padding: 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--linha) }
.col-lista .filtros .segmentos { display: flex }
.col-lista .filtros .segmentos button { flex: 1; padding: 0 8px; justify-content: center }
.selects { display: flex; gap: 8px }
.sel { flex: 1; min-width: 0; height: 36px; border-radius: 999px; border: 1px solid var(--linha); background: var(--cartao); padding: 0 12px; font-size: 13.5px; color: var(--tinta-2) }
.conversas { overflow-y: auto; flex: 1 }
.conv { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border: 0; background: none; text-align: left; width: 100%; border-bottom: 1px solid var(--linha); transition: background-color .15s var(--ease) }
.conv:hover { background: var(--fundo-baixo) }
.conv[aria-current="true"] { background: var(--indigo-6) }
.conv .av { position: relative }
.conv .canal { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--cartao); display: grid; place-items: center; color: var(--tinta-2); box-shadow: 0 0 0 2px var(--cartao) }
.conv .canal svg { width: 12px; height: 12px }
.conv .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.conv .l1 b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.conv .l1 small { color: var(--suave); font-size: 12.5px; white-space: nowrap }
.conv p { margin: 2px 0 0; font-size: 13.5px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.conv.por-ler p { color: var(--tinta) }
.conv .por-ler-p { width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); display: inline-block; margin-left: 6px; vertical-align: 1px }

.col-conv { display: flex; flex-direction: column; background: var(--lona) }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (n, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#${n}"/></svg>`;
const n2 = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const pct = (n, c = 1) => n.toFixed(c).replace('.', ',') + '%';
const mt = (n) => n2(n) + ' MT';
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- dados de exemplo (coerentes entre si) ---------- */
const DIAS = 30, hoje = new Date(2026, 10, 12);
const serie = Array.from({ length: DIAS }, (_, i) => {
  const d = new Date(hoje); d.setDate(d.getDate() - (DIAS - 1 - i));
  const fds = [0, 6].includes(d.getDay());
  const v = Math.round((112 + i * 1.9 + Math.sin(i * 1.7) * 9) * (fds ? 0.6 : 1));
  return { d, v };
});
const TOTAL = serie.reduce((a, s) => a + s.v, 0);
const media7 = serie.map((_, i) => { const j = serie.slice(Math.max(0, i - 6), i + 1); return j.reduce((a, s) => a + s.v, 0) / j.length; });
const CANAIS = [['Google', 1712, 16], ['Directo', 968, 8], ['Instagram', 571, 4], ['LinkedIn', 326, 6], ['WhatsApp', 203, 3], ['Outros', 284, 0]];
const LEADS = CANAIS.reduce((a, c) => a + c[2], 0);
const PAGINAS = [['/', 'Página inicial', 2140, 9], ['/desenvolvimento-tecnologico/websites-e-aplicativos', 'Websites e Aplicativos', 812, 11], ['/pedido-de-cotacao', 'Pedido de cotação', 604, 31], ['/desenvolvimento-editorial/perfis-corporativos', 'Perfis Corporativos', 433, 5], ['/blog/quanto-custa-criar-um-site-em-mocambique', 'Quanto custa criar um site', 398, 4]];

/* ---------- gráfico principal: barras por dia + média de 7 dias ---------- */
function monotona(pts) {
  const n = pts.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += ` C${pts[i][0] + h},${pts[i][1] + t[i] * h} ${pts[i + 1][0] - h},${pts[i + 1][1] - t[i + 1] * h} ${pts[i + 1][0]},${pts[i + 1][1]}`; }
  return d;
}
function grafVisitas(el) {
  const W = Math.max(320, Math.round(el.clientWidth || 760)), H = 260, P = { e: 36, d: 6, t: 14, b: 28 };
  const max = Math.ceil(Math.max(...serie.map((s) => s.v)) / 50) * 50;
  const larg = (W - P.e - P.d) / DIAS, bw = Math.max(3, larg * 0.62);
  const cx = (i) => P.e + larg * i + larg / 2, y = (v) => H - P.b - (v / max) * (H - P.t - P.b);
  const passo = W < 520 ? 10 : 5;
  el.innerHTML = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por dia nos últimos 30 dias, com a média de 7 dias">
    ${[0, max / 2, max].map((p) => `<line class="gl" x1="${P.e}" x2="${W - P.d}" y1="${y(p)}" y2="${y(p)}"/><text x="${P.e - 8}" y="${y(p) + 4}" text-anchor="end">${n2(p)}</text>`).join('')}
    ${serie.map((s, i) => `<rect x="${cx(i) - bw / 2}" y="${y(s.v)}" width="${bw}" height="${H - P.b - y(s.v)}" rx="${Math.min(4, bw / 2)}" fill="${i === DIAS - 1 ? 'var(--laranja)' : 'var(--indigo-24)'}" data-i="${i}"/>`).join('')}
    <path d="${monotona(media7.map((v, i) => [cx(i), y(v)]))}" fill="none" stroke="var(--indigo)" stroke-width="2"/>
    ${serie.map((s, i) => (i % passo === 0 && DIAS - 1 - i >= passo / 2) || i === DIAS - 1 ? `<text x="${cx(i)}" y="${H - 8}" text-anchor="${i === DIAS - 1 ? 'end' : 'middle'}">${i === DIAS - 1 ? 'Hoje' : s.d.getDate() + ' ' + s.d.toLocaleDateString('pt-PT', { month: 'short' }).replace('.', '')}</text>` : '').join('')}
  </svg><div class="dica" hidden></div>`;
  const svg = $('svg', el), dica = $('.dica', el);
  const mostra = (i) => {
    const r = svg.getBoundingClientRect(), s = serie[i];
    $$('rect', svg).forEach((b) => b.setAttribute('opacity', +b.dataset.i === i ? 1 : 0.55));
    dica.hidden = false; dica.style.left = Math.min(Math.max((cx(i) / W) * r.width, 90), r.width - 90) + 'px'; dica.style.top = (y(s.v) / H) * r.height + 'px';
    dica.innerHTML = `${s.d.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'short' })}<b class="num">${n2(s.v)} visitas</b>média de 7 dias: ${n2(media7[i])}`;
  };
  svg.addEventListener('pointermove', (e) => { const r = svg.getBoundingClientRect(); const vx = ((e.clientX - r.left) / r.width) * W; mostra(Math.max(0, Math.min(DIAS - 1, Math.floor((vx - P.e) / larg)))); });
  svg.addEventListener('pointerleave', () => { dica.hidden = true; $$('rect', svg).forEach((b) => b.removeAttribute('opacity')); });
}

/* ---------- vistas ---------- */
const V = {};
const kpi = (icone, rot, valor, barras, delta, cls = 'sobe') => `
  <div class="cartao kpi"><div class="kpi-rot">${ic(icone)}${rot}</div>
    <div class="kpi-linha"><div><div class="kpi-valor">${valor}</div><div class="delta ${cls}" style="margin-top:8px">${delta}</div></div>
    <div class="barras" aria-hidden="true">${barras.map((h) => `<i style="height:${h}%"></i>`).join('')}</div></div></div>`;

V.dashboard = () => `
  <div class="grelha">
    <section class="cartao saudacao" aria-labelledby="t-ola">
      <div><h1 id="t-ola">Bom dia, Shelton</h1><p>O site teve <span class="num">${n2(serie[DIAS - 1].v)}</span> visitas hoje e há 7 pessoas a navegar agora.</p>
        <div class="atalhos"><a class="atalho urgente" href="#inbox"><b class="num">3</b>Conversas por responder</a><a class="atalho" href="#contactos"><b class="num">5</b>Leads novos esta semana</a><a class="atalho urgente" href="#tarefas"><b class="num">2</b>Tarefas atrasadas</a></div></div>
      <div class="segmentos" role="group" aria-label="Período"><button type="button" aria-pressed="false">Hoje</button><button type="button" aria-pressed="false">7 dias</button><button type="button" aria-pressed="true">30 dias</button><button type="button" aria-pressed="false">12 meses</button></div>
    </section>

    <section class="kpis" aria-label="Indicadores dos últimos 30 dias">
      ${kpi('eye', 'Visitas', n2(TOTAL), [52, 61, 58, 70, 84], '+18% face aos 30 dias anteriores')}
      ${kpi('user', 'Visitantes únicos', n2(TOTAL * 0.74), [55, 60, 57, 69, 80], '+12% face aos 30 dias anteriores')}
      ${kpi('clock', 'Tempo médio por visita', '2<small> min </small>41<small> s</small>', [80, 76, 82, 74, 71], '2,8 páginas por visita', 'neutro')}
      ${kpi('target', 'Leads gerados', LEADS, [40, 55, 48, 66, 92], '+9 · conversão de ' + pct((LEADS / TOTAL) * 100, 2))}
    </section>

    <div class="principal-graf">
      <section class="cartao" aria-labelledby="t-visitas">
        <div class="cab"><div><h2 id="t-visitas">Visitas por dia</h2><p>Últimos 30 dias. Os fins-de-semana têm menos movimento.</p></div>
          <div class="legenda"><span><i class="amostra" style="background:var(--indigo-24)"></i>Visitas</span><span><i class="amostra" style="height:2px;background:var(--indigo)"></i>Média de 7 dias</span><span><i class="amostra" style="background:var(--laranja)"></i>Hoje</span></div></div>
        <div class="ref-graf" id="g-visitas"></div>
        <details class="numeros"><summary>Ver os números por dia</summary><div class="tabela" style="max-height:220px;margin-top:8px"><table><thead><tr><th>Dia</th><th class="d">Visitas</th></tr></thead><tbody>${serie.slice().reverse().map((s) => `<tr><td>${s.d.toLocaleDateString('pt-PT', { weekday: 'short', day: 'numeric', month: 'short' })}</td><td class="d num">${n2(s.v)}</td></tr>`).join('')}</tbody></table></div></details>
      </section>
      <section class="cartao agora" aria-labelledby="t-agora">
        <div class="cab" style="margin:0"><h2 id="t-agora">No site agora</h2><a class="botao fantasma peq" href="#ao-vivo">Ver todos</a></div>
        <div class="grande"><strong class="num">7</strong><span class="ponto-vivo" style="margin:0"><i></i>pessoas a navegar</span></div>
        <ul>
          <li><span>Ana Mabunda · Websites e Aplicativos</span><span>no chat</span></li>
          <li><span>Anónimo · Pedido de cotação</span><span>4 min</span></li>
          <li><span>Carlos Nhantumbo · Gestão de Redes Sociais</span><span>2 min</span></li>
          <li><span>Anónimo · Página inicial</span><span>1 min</span></li>
        </ul>
      </section>
    </div>

    <section class="cartao" aria-labelledby="t-canais">
      <div class="cab"><div><h2 id="t-canais">De onde vêm as visitas e os clientes</h2><p>O LinkedIn traz menos visitas, mas converte duas vezes mais do que o Google.</p></div></div>
      <div class="tabela"><table>
        <thead><tr><th>Fonte</th><th>Visitas</th><th class="d">Leads</th><th class="d">Conversão</th></tr></thead>
        <tbody>${CANAIS.map(([f, v, l]) => { const c = l ? (l / v) * 100 : 0; return `<tr><td>${f}</td>
          <td><div class="barra-celula"><span class="trilho"><i style="width:${(v / CANAIS[0][1]) * 100}%"></i></span><span class="num d">${n2(v)}</span></div></td>
          <td class="d num">${l || '–'}</td><td class="d">${f === 'LinkedIn' ? `<span class="pilula laranja num">${pct(c, 2)} · a melhor</span>` : `<span class="num">${l ? pct(c, 2) : '–'}</span>`}</td></tr>`; }).join('')}</tbody>
      </table></div>
    </section>

    <div class="duas">
      <section class="cartao" aria-labelledby="t-accoes">
        <div class="cab"><div><h2 id="t-accoes">O que os visitantes fazem</h2><p>Cliques e envios nos últimos 30 dias</p></div></div>
        <ul class="lista-accoes">${[['arrowRight', 'Clicaram em «Pedir cotação»', 212], ['whatsapp', 'Abriram o WhatsApp', 94], ['download', 'Descarregaram um material', 63], ['phone', 'Clicaram no telefone', 46], ['file', 'Enviaram o formulário de cotação', 31], ['message', 'Começaram uma conversa no chat', 18]]
          .map(([i, t, n]) => `<li><span class="ic">${ic(i)}</span><span>${t}</span><span class="n num">${n2(n)}</span><span class="trilho"><i style="width:${(n / 212) * 100}%"></i></span></li>`).join('')}</ul>
      </section>
      <section class="cartao" aria-labelledby="t-funil">
        <div class="cab"><div><h2 id="t-funil">Do clique ao lead</h2><p>Quantas visitas avançam em cada passo</p></div></div>
        <div class="funil">
          <div class="passo"><span class="nome">Visitas</span><span class="val num">${n2(TOTAL)}</span><span class="trilho"><i style="width:100%"></i></span></div>
          <div class="taxa">${ic('arrowDown')}<span><b class="num">46%</b> abrem uma página de serviço</span></div>
          <div class="passo"><span class="nome">Viram um serviço</span><span class="val num">1 870</span><span class="trilho"><i style="width:46%"></i></span></div>
          <div class="taxa">${ic('arrowDown')}<span><b class="num">32%</b> abrem a cotação</span></div>
          <div class="passo"><span class="nome">Abriram a cotação</span><span class="val num">604</span><span class="trilho"><i style="width:15%"></i></span></div>
          <div class="taxa">${ic('arrowDown')}<span><b class="num">6%</b> enviam o pedido</span></div>
          <div class="passo fim"><span class="nome">Tornaram-se lead</span><span class="val num">${LEADS}</span><span class="trilho"><i style="width:${Math.max(2, (LEADS / TOTAL) * 100)}%"></i></span></div>
        </div>
      </section>
    </div>

    <div class="duas">
      <section class="cartao" aria-labelledby="t-paginas">
        <div class="cab"><div><h2 id="t-paginas">Páginas mais vistas</h2><p>E quantos leads começaram em cada uma</p></div></div>
        <div class="tabela"><table><thead><tr><th>Página</th><th class="d">Vistas</th><th class="d">Leads</th></tr></thead>
          <tbody>${PAGINAS.map(([u, t, v, l]) => `<tr><td>${t}<div class="url">${u}</div></td><td class="d num">${n2(v)}</td><td class="d num">${l}</td></tr>`).join('')}</tbody></table></div>
      </section>
      <section class="cartao" aria-labelledby="t-publico">
        <div class="cab"><div><h2 id="t-publico">Quem visita</h2><p>Dispositivo e país</p></div></div>

        <td><div class="pessoa"><span class="avatar">${iniN(n)}</span><div style="min-width:0"><b>${n}</b><small>${e}</small></div></div></td>
        <td>${emp}</td><td>${o}</td><td><span class="pilula ${s === 'Lead quente' ? 'laranja' : ''}">${s}</span></td><td class="d">${d}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;
V.contactos.depois = () => {
  const actual = () => { const n = $$('.sel-c').filter((c) => c.checked).length; $('#massa').hidden = !n; $('#n-sel').textContent = `${n} seleccionado${n > 1 ? 's' : ''}`; };
  $$('.sel-c').forEach((c) => c.addEventListener('change', actual));
  $('#todos').addEventListener('change', (e) => { $$('.sel-c').forEach((c) => (c.checked = e.target.checked)); actual(); });
  $$('[data-contacto]').forEach((tr) => tr.addEventListener('click', (e) => { if (e.target.matches('input')) return; ficha(CONTACTOS[+tr.dataset.contacto]); }));
};
function ficha([n, e, emp, o]) {
  const f = document.createElement('div');
  f.innerHTML = `<div class="gaveta-fundo" data-f></div><aside class="gaveta" role="dialog" aria-modal="true" aria-label="Ficha de ${n}">
    <button class="b-icone fechar" type="button" data-f aria-label="Fechar a ficha">${ic('x')}</button>
    <div class="cartao" style="display:flex;gap:14px;align-items:center"><span class="avatar" style="width:56px;height:56px;font-size:18px">${iniN(n)}</span><div style="min-width:0"><h2 style="font-size:21px;letter-spacing:-.015em">${n}</h2><div style="color:var(--suave);font-size:13.5px;overflow-wrap:anywhere">${e}</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="botao fantasma peq" type="button">${ic('edit')}Nota</button><button class="botao fantasma peq" type="button">${ic('mail')}Email</button><button class="botao fantasma peq" type="button">${ic('calendar')}Tarefa</button><button class="botao fantasma peq" type="button">${ic('kanban')}Negócio</button></div>
    <div class="cartao"><h2 style="font-size:17px;margin-bottom:12px">Informação</h2><dl class="campos">
      <div><dt>Empresa</dt><dd>${emp}</dd></div><div><dt>Veio de</dt><dd>${o}, primeira visita a 28 out</dd></div><div><dt>Telefone</dt><dd class="num">+258 84 123 4567</dd></div>
      <div><dt>Listas</dt><dd>Leads do site, Newsletter</dd></div><div><dt>Consentimento</dt><dd>Email de marketing, aceite a 28 out</dd></div><div><dt>No site</dt><dd><span class="num">4</span> visitas, <span class="num">17</span> páginas</dd></div></dl></div>
    <div class="cartao"><h2 style="font-size:17px;margin-bottom:14px">Histórico</h2><ul class="historico">
      <li class="dia-h">Hoje</li>
      <li><span class="ic">${ic('kanban')}</span><div>Negócio criado: Site com área de clientes<small>11:45 · por Shelton</small></div></li>
      <li><span class="ic">${ic('message')}</span><div>Começou uma conversa no chat<small>11:28 · em Websites e Aplicativos</small></div></li>
      <li><span class="ic">${ic('eye')}</span><div>Viu 3 páginas: Página inicial, Websites e Aplicativos, Quanto custa criar um site<small>11:24</small></div></li>
      <li class="dia-h">28 de outubro</li>
      <li><span class="ic">${ic('file')}</span><div>Pediu cotação de Perfis Corporativos<small>vinda do LinkedIn</small></div></li>
    </ul></div></aside>`;
  document.body.appendChild(f);
  const fecha = () => { f.remove(); document.removeEventListener('keydown', escTecla); };
  const escTecla = (ev) => { if (ev.key === 'Escape') fecha(); };
  $$('[data-f]', f).forEach((b) => b.addEventListener('click', fecha)); document.addEventListener('keydown', escTecla);
  $('.fechar', f).focus();
}

const TAREFAS = [
  ['phone', 'Enviar proposta revista', 'CRM comercial · Matola Gás', 'Atrasada · 10 nov', 'a'],
  ['mail', 'Confirmar recepção do perfil', 'Perfil corporativo · Tete Mineração', 'Atrasada · ontem', 'a'],
  ['message', 'Responder no chat', 'Site com área de clientes · Mabunda Logística', 'Hoje, 12:00', 'h'],
  ['phone', 'Ligar para qualificar', 'Gestão de redes sociais · Cossa & Filhos', 'Hoje, 15:00', 'h'],
  ['calendar', 'Reunião na clínica', 'Site da segunda unidade · Clínica Polana', 'Sex 15 nov, 17:30', 's'],
];
let filtroT = 'a';
const daTarefa = (t, k) => k === 't' || t[4] === k || (k === 's' && t[4] !== 'a');
V.tarefas = () => `<div class="cabeca-pag"><div><h1>Tarefas</h1><p>O seguimento de cada lead e de cada negócio.</p></div><button class="botao accao" type="button">${ic('plus')}Criar tarefa</button></div>
  <section class="cartao">
    <div class="segmentos" role="group" aria-label="Mostrar" style="margin-bottom:10px;max-width:100%;overflow-x:auto">${[['a', 'Atrasadas'], ['h', 'Hoje'], ['s', 'Esta semana'], ['t', 'Todas']].map(([k, r]) => `<button type="button" data-t="${k}" aria-pressed="${k === filtroT}">${r} <span class="num">${TAREFAS.filter((t) => daTarefa(t, k)).length}</span></button>`).join('')}</div>
    <div>${TAREFAS.filter((t) => daTarefa(t, filtroT)).map(([i, t, q, d, k]) => `<label class="tarefa"><input type="checkbox"><span class="ic">${ic(i)}</span><span style="min-width:0"><b>${t}</b><small>${q}</small></span>${k === 'a' ? `<span class="pilula vermelho">${ic('alert')}${d}</span>` : `<span class="pilula">${d}</span>`}</label>`).join('')}</div>
  </section>`;
V.tarefas.depois = () => {
  $$('[data-t]').forEach((b) => b.addEventListener('click', () => { filtroT = b.dataset.t; render(); }));
  $$('.tarefa input').forEach((c) => c.addEventListener('change', () => { c.closest('.tarefa').classList.toggle('feita', c.checked); if (c.checked) aviso('Tarefa concluída. Fica no histórico do contacto.', true); }));
};

V.widget = () => `
  <div class="cabeca-pag"><div><h1>Chat do site</h1><p>Assim o chat aparece aos visitantes da Kingdom Company.</p></div><div class="segmentos" role="group" aria-label="Estado da equipa"><button type="button" aria-pressed="true" data-w="on">Equipa online</button><button type="button" aria-pressed="false" data-w="off">Equipa offline</button></div></div>
  <div class="palco">
    <section class="site-falso" aria-label="Pré-visualização no site"><div class="txt"><span style="font-weight:500">Kingdom Company</span><h3>Um único lugar. Tudo o que precisa.</h3><p>O chat fica no canto inferior direito de todas as páginas.</p></div><div class="widget" id="widget"></div></section>
    <section class="cartao" aria-labelledby="t-wcfg">
      <h2 id="t-wcfg" style="margin-bottom:14px">Definições do chat</h2>
      <dl class="campos">
        <div><dt>Saudação</dt><dd>Olá! Em que podemos ajudar?</dd></div>
        <div><dt>Cores</dt><dd>Cabeçalho índigo, botão de enviar laranja</dd></div>
        <div><dt>Posição</dt><dd>Canto inferior direito</dd></div>
        <div><dt>Sem ninguém online</dt><dd>Formulário com nome, email e consentimento; a resposta segue por email</dd></div>
        <div><dt>Avisos</dt><dd>Notificação no painel e email a cada conversa nova</dd></div>
      </dl>
    </section>
  </div>`;
V.widget.depois = () => {
  const w = $('#widget'), cab = (on) => `<div class="w-cab"><span class="avatar">K</span><div><b>Kingdom Company</b><small><i class="vivo-i" style="${on ? '' : 'background:#A6A097'}"></i>${on ? 'Respondemos em poucos minutos' : 'Estamos offline'}</small></div></div>`;
  const on = () => { w.innerHTML = cab(true) + `<div class="w-corpo"><div class="w-msg">Olá! Em que podemos ajudar?</div><div class="w-msg eu">Quanto tempo demora um site com área de clientes?</div><div class="w-msg">Depende do que a área precisa de mostrar. Quantos clientes vão entrar?</div></div><form class="w-pe" onsubmit="event.preventDefault()"><label class="sr" for="w-in">Mensagem</label><input id="w-in" placeholder="Escreva a sua mensagem"><button aria-label="Enviar">${ic('send')}</button></form>`; };
  const off = () => { w.innerHTML = cab(false) + `<form class="offline" onsubmit="event.preventDefault()"><p>Neste momento não estamos online. Deixe o seu contacto e respondemos por email.</p><label>Nome<input autocomplete="name"></label><label>Email<input type="email" autocomplete="email"></label><label>Mensagem<textarea rows="2"></textarea></label><label class="cons"><input type="checkbox"> Aceito que a Kingdom Company guarde estes dados para me responder.</label><button>Enviar mensagem</button></form>`; };
  on();
  $$('[data-w]').forEach((b) => b.addEventListener('click', () => { $$('[data-w]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); (b.dataset.w === 'on' ? on : off)(); }));
};

/* ---------- confirmação, avisos, router ---------- */
function confirmar(titulo, texto, accao, feito) {
  const d = $('#d-etapa'), f = $('#f-etapa');
  f.innerHTML = `<h2>${titulo}</h2><p>${texto}</p><div class="acoes-d"><button class="botao calmo" value="cancel">Cancelar</button><button class="botao fantasma" value="ok" id="b-conf" style="color:var(--vermelho-tinta)">${accao}</button></div>`;
  d.showModal(); $('#b-conf').onclick = () => setTimeout(feito);
}
let tempo;
function aviso(t, bom) {
  $('.aviso')?.remove(); clearTimeout(tempo);
  const a = document.createElement('div'); a.className = 'aviso'; a.setAttribute('role', 'status');
  a.innerHTML = (bom ? ic('check') : '') + `<span>${esc(t)}</span>`;
  document.body.appendChild(a); tempo = setTimeout(() => a.remove(), 4200);
}
const TITULOS = { dashboard: 'Dashboard', 'ao-vivo': 'Ao vivo', inbox: 'Inbox', contactos: 'Contactos', negocios: 'Negócios', tarefas: 'Tarefas', widget: 'Chat do site' };
function render() {
  const k = V[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
  $('#vista').innerHTML = V[k]();
  $$('[data-v]').forEach((a) => a.dataset.v === k ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (['ao-vivo', 'contactos', 'widget'].includes(k)) $('#b-mais').setAttribute('aria-current', 'page'); else $('#b-mais').removeAttribute('aria-current');
  V[k].depois && V[k].depois();
  $$('.saudacao .segmentos button, .barra-neg .segmentos button, .filtros .segmentos button').forEach((b) => b.addEventListener('click', () => b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))));
  document.title = (k === 'dashboard' ? '' : TITULOS[k] + ' · ') + 'Painel Kingdom';
}
const folha = $('#folha'), bMais = $('#b-mais');
bMais.addEventListener('click', () => { const ab = folha.classList.toggle('aberta'); bMais.setAttribute('aria-expanded', String(ab)); });
$$('a', folha).forEach((a) => a.addEventListener('click', () => { folha.classList.remove('aberta'); bMais.setAttribute('aria-expanded', 'false'); }));
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
