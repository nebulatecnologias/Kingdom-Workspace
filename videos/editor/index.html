<title>Estúdio Kingdom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:wght@400;500&display=swap">
<style>
/* Layout: editor de uma tela à moda do CapCut — topo, três colunas (ficheiros · leitor · direção) e timeline em camadas embaixo.
   Paleta da marca: laranja, grafite e branco. Visual escuro único (ferramenta de edição). */
:root {
  --bg: #121110; --painel: #191816; --painel-2: #201f1d; --linha: #2c2b28; --linha-2: #3a3936;
  --texto: #f4f2ef; --suave: #a7a29b; --fraco: #8f8a83;
  --laranja: #ff5a00; --laranja-2: #ff7a27; --laranja-3: #ffa468; --laranja-bg: rgba(255,90,0,.14);
  --branco: #ffffff;
  --f-ui: "Google Sans", "Segoe UI", system-ui, sans-serif;
  --f-cod: "Google Sans Code", ui-monospace, "SFMono-Regular", monospace;
  --raio: 8px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--texto); font-family: var(--f-ui); font-size: 13px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--painel); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--laranja-2); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* topo */
.topo { display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--painel); border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
.marca b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.marca span { color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.espaco { flex: 1; }
.formatos { display: flex; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 999px; padding: 3px; gap: 2px; }
.formatos button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; color: var(--suave); font-family: var(--f-cod); font-size: 12px; }
.formatos button[aria-pressed="true"] { background: var(--laranja); color: var(--branco); }
.btn { border: 1px solid var(--linha-2); background: var(--painel-2); border-radius: 999px; padding: 7px 14px; font-weight: 500; }
.btn:hover { border-color: var(--suave); }
.btn.prim { background: var(--laranja); border-color: var(--laranja); color: var(--branco); }
.btn.prim:hover { background: var(--laranja-2); }

/* corpo: três colunas */
.corpo { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; min-height: 0; }
.painel { background: var(--painel); border-right: 1px solid var(--linha); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.painel.dir { border-right: 0; border-left: 1px solid var(--linha); }
.abas { display: flex; border-bottom: 1px solid var(--linha); }
.abas button { flex: 1; border: 0; background: transparent; padding: 10px 6px; color: var(--suave); border-bottom: 2px solid transparent; font-weight: 500; }
.abas button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--laranja); }
.rolagem { overflow-y: auto; min-height: 0; flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.grupo h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .08em; }
.ficheiro { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px; border-radius: var(--raio); }
.ficheiro:hover { background: var(--painel-2); }
.ficheiro .mini { width: 44px; height: 56px; border-radius: 5px; background: var(--painel-2) center/cover no-repeat; display: grid; place-items: center; font-family: var(--f-cod); font-size: 11px; color: var(--suave); border: 1px solid var(--linha); overflow: hidden; }
.ficheiro .mini.quad { height: 44px; }
.ficheiro .nome { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ficheiro .meta { color: var(--suave); font-size: 12px; font-family: var(--f-cod); }
.ficheiro .acao { grid-column: 2; justify-self: start; border: 0; background: none; color: var(--laranja-2); padding: 0; font-size: 12px; }
.solta { border: 1px dashed var(--linha-2); border-radius: var(--raio); padding: 14px; text-align: center; color: var(--suave); }
.solta.ativo { border-color: var(--laranja); background: var(--laranja-bg); color: var(--texto); }
.solta label { color: var(--laranja-2); cursor: pointer; font-weight: 500; }
.legenda-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.legenda-item:hover { background: var(--painel-2); }
.legenda-item.atual { border-color: var(--laranja); background: var(--laranja-bg); }
.legenda-item time { font-family: var(--f-cod); color: var(--suave); font-size: 12px; }
.legenda-item .tx { min-width: 0; }
.legenda-item.verso .tx { font-style: italic; }
.ref { display: inline-block; margin-top: 4px; font-family: var(--f-cod); font-size: 11px; letter-spacing: .06em; border: 1px solid var(--linha-2); border-radius: 999px; padding: 2px 10px; color: var(--suave); font-style: normal; }

/* palco */
.palco { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: radial-gradient(ellipse at 50% 40%, #1d1c1a 0%, var(--bg) 70%); }
.tela-zona { display: grid; place-items: center; min-height: 0; padding: 16px; position: relative; }
.moldura { position: relative; overflow: hidden; background: #000; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 100%; max-height: 100%; }
.moldura canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#fundo16 { filter: blur(18px) brightness(.55); }
.zona-segura { position: absolute; inset: 0; pointer-events: none; display: none; }
.zona-segura.on { display: block; }
.zona-segura::before { content: ""; position: absolute; inset: 7% 5% 18% 5%; border: 1px dashed rgba(255,255,255,.35); border-radius: 4px; }
.aviso-formato { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--suave); background: rgba(18,17,16,.85); padding: 4px 10px; border-radius: 999px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.transporte { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px 12px; flex-wrap: wrap; }
.icone { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linha-2); background: var(--painel-2); display: grid; place-items: center; }
.icone.grande { width: 44px; height: 44px; background: var(--laranja); border-color: var(--laranja); }
.icone svg { width: 16px; height: 16px; fill: currentColor; }
.icone[aria-pressed="true"] { border-color: var(--laranja); color: var(--laranja-2); }
.tempo { font-family: var(--f-cod); font-variant-numeric: tabular-nums; color: var(--suave); min-width: 120px; text-align: center; }
.tempo b { color: var(--texto); font-weight: 500; }

/* direita: inspetor + direção */
.insp { padding: 12px; border-bottom: 1px solid var(--linha); display: flex; flex-direction: column; gap: 8px; }
.insp h2 { margin: 0; font-size: 14px; font-weight: 600; }
.insp .tipo { font-size: 11px; color: var(--laranja-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.props { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; }
.props dt { color: var(--suave); }
.props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.props .cod { font-family: var(--f-cod); }
.amostra { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(255,255,255,.25); }
.vazio { color: var(--suave); }
.direcao { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.direcao .cab { padding: 12px 12px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.direcao .cab h2 { margin: 0; font-size: 14px; font-weight: 600; }
.direcao .cab span { color: var(--suave); font-size: 12px; }
.pedidos { overflow-y: auto; flex: 1; min-height: 80px; padding: 4px 12px; display: flex; flex-direction: column; gap: 10px; }
.pedido { background: var(--painel-2); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.pedido .linha1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pedido time { font-family: var(--f-cod); font-size: 11px; color: var(--fraco); }
.estado { font-size: 11px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--laranja); color: var(--laranja-3); white-space: nowrap; }
.estado.andamento { background: var(--laranja); color: var(--branco); }
.estado.feito { border-color: var(--branco); color: var(--branco); }
.pedido .contexto { font-family: var(--f-cod); font-size: 11px; color: var(--suave); }
.pedido .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
.pedido .resposta { border-left: 2px solid var(--laranja); padding-left: 8px; color: var(--suave); white-space: pre-wrap; }
.pedido .resposta b { color: var(--texto); font-weight: 500; }
.compor { padding: 10px 12px 12px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 8px; }
.chip { align-self: flex-start; font-family: var(--f-cod); font-size: 11px; background: var(--laranja-bg); color: var(--laranja-3); border-radius: 999px; padding: 4px 10px; display: flex; gap: 6px; align-items: center; max-width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: none; padding: 0; color: inherit; }
.compor textarea { resize: none; min-height: 64px; border-radius: 10px; border: 1px solid var(--linha-2); background: var(--painel-2); padding: 9px 10px; line-height: 1.45; }
.compor textarea::placeholder { color: var(--fraco); }
.compor .acoes { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.compor .nota { color: var(--suave); font-size: 11.5px; }

/* timeline */
.timeline { background: var(--painel); border-top: 1px solid var(--linha); display: grid; grid-template-rows: auto minmax(0, 1fr); height: 306px; min-width: 0; }
.tl-barra { display: flex; align-items: center; gap: 12px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.tl-barra label { color: var(--suave); display: flex; gap: 8px; align-items: center; }
.tl-barra input[type=range] { accent-color: var(--laranja); width: 120px; }
.tl-corpo { display: grid; grid-template-columns: 132px minmax(0, 1fr); min-height: 0; }
.tl-nomes { border-right: 1px solid var(--linha); padding-top: 24px; }
.tl-nome { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--suave); font-size: 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
.tl-nome i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tl-trilhas { overflow: auto; position: relative; min-width: 0; }
.tl-conteudo { position: relative; }
.regua { height: 24px; position: sticky; top: 0; z-index: 3; background: var(--painel); border-bottom: 1px solid var(--linha); cursor: pointer; }
.regua .marca-t { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--linha-2); font-family: var(--f-cod); font-size: 11px; color: var(--fraco); padding: 4px 0 0 4px; }
.regua .marca-t.peq { height: 6px; top: auto; bottom: 0; }
.trilha { height: 32px; position: relative; border-bottom: 1px solid var(--linha); }
.bloco { position: absolute; top: 4px; height: 24px; border-radius: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; padding: 0 8px; line-height: 24px; border: 1px solid transparent; cursor: pointer; text-align: left; }
.bloco:hover { filter: brightness(1.12); }
.bloco.sel { border-color: var(--branco); box-shadow: 0 0 0 1px var(--branco); }
.bloco.cena { color: #1a1917; font-weight: 600; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
.bloco.cena img { height: 22px; width: 12px; object-fit: cover; border-radius: 2px; flex: none; }
.bloco.anim { background: var(--painel-2); border-color: var(--linha-2); color: var(--texto); }
.bloco.leg { background: #2b2a28; color: var(--texto); }
.bloco.verso { background: rgba(255,122,39,.18); border-color: rgba(255,122,39,.5); color: var(--laranja-3); font-style: italic; }
.sfx { position: absolute; top: 9px; width: 10px; height: 14px; margin-left: -5px; border: 0; padding: 0; background: none; cursor: pointer; }
.sfx::before { content: ""; position: absolute; left: 1px; top: 2px; width: 8px; height: 8px; transform: rotate(45deg); background: var(--laranja-2); border-radius: 1px; }
.sfx.grave::before { background: var(--branco); }
.sfx.longo { width: auto; margin-left: 0; height: 14px; border-radius: 3px; background: rgba(255,122,39,.22); }
.sfx.longo::before { display: none; }
.trilha canvas { position: absolute; left: 0; top: 2px; }
.voz-vazia { position: absolute; inset: 4px 0; border: 1px dashed var(--linha-2); border-radius: 5px; color: var(--fraco); font-size: 11.5px; display: flex; align-items: center; padding-left: 10px; }
.cabeca { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--laranja); z-index: 4; pointer-events: none; }
.cabeca::before { content: ""; position: absolute; top: 0; left: -7px; width: 12px; height: 12px; background: var(--laranja); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.dica { position: fixed; z-index: 20; background: var(--painel-2); border: 1px solid var(--linha-2); border-radius: 6px; padding: 4px 8px; font-size: 11.5px; pointer-events: none; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--texto); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 500; z-index: 30; }

/* telas estreitas: tudo empilhado, rolagem da página */
@media (max-width: 980px) {
  body { overflow: auto; }
  .app { height: auto; display: block; }
  .corpo { display: flex; flex-direction: column; }
  .palco { order: 1; } .painel.dir { order: 2; border-left: 0; border-top: 1px solid var(--linha); } .painel.esq { order: 3; border-right: 0; border-top: 1px solid var(--linha); }
  .tela-zona { height: 62vh; }
  .rolagem, .pedidos { max-height: 360px; }
  .timeline { height: 300px; }
  .tl-corpo { grid-template-columns: 96px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">

    <div class="formatos" role="group" aria-label="Formato do vídeo">

</div>

(() => {

  const NOMES_OBJ = { edificar: 'Coluna de luz', incluir: 'Figuras se aproximam', comunicar: 'Ondas de voz', limites: 'Cilindro de limite', focar: 'Moldura de foco', paz: 'Nuvem, chuva e escudo', deixar: 'Esferas que sobem', encorajar: 'Sol listrado', apoiar: 'Moeda e arcos de apoio', celebrar: 'Brilhos e confete', reflexo: 'Espelho e coração', valor: 'Régua e aura dourada' };

    try { await dl.save({ filename, data }); } catch (e) { if (e?.code !== 'declined') toast('Não foi possível baixar: ' + (e?.message || e?.code || 'erro')); }
  }

  /* ---------- capacidades: pedidos (db), ficheiros (assets) ---------- */
  let db = null, assets = null, user = null, comentarios = null, ouvindo = 'off', podeCarregar = false, contexto = null, meuId = null;
  const ROTULO_OUVINDO = { available: 'Claude a ouvir', no_session: 'Claude fora da sessão — pedidos guardados', writers_only: 'só editores avisam o Claude', off: 'pedidos guardados' };
  async function atualizarOuvindo() {
    if (comentarios) { try { ouvindo = await comentarios.canSendToClaude(); } catch (e) { ouvindo = 'off'; } }
    if (db) $('estado-db').textContent = ROTULO_OUVINDO[ouvindo] || ROTULO_OUVINDO.off;
    $('nota-envio').textContent = ouvindo === 'available' ? 'Enter envia direto ao Claude · Shift+Enter quebra linha' : 'Enter guarda o pedido · diga "veja os pedidos" no chat';
  }
  function mostrarChip() {
    const ch = $('chip-contexto'), tx = contexto ? `${contexto.rotulo} · ${fmt(contexto.t0)}` : `Momento ${fmt(t)}`;
    $('chip-texto').textContent = tx; ch.hidden = false; $('chip-limpar').hidden = !contexto;
  }
  $('chip-limpar').onclick = () => { contexto = null; selecionado = null; marcarSelecao(); inspetor(); mostrarChip(); };
  function renderPedidos(lista) {
    const el = $('pedidos');
    if (!lista.length) { el.innerHTML = `<p class="vazio" style="margin:4px 0">Nenhum pedido ainda. Escreva abaixo o que quer mudar: o Claude lê estes pedidos, aplica no vídeo e responde aqui com o estado.</p>`; return; }
    const ESTADOS = { pendente: 'Pendente', andamento: 'Em andamento', feito: 'Feito' };
    el.innerHTML = lista.map(p => `<article class="pedido"><div class="linha1"><time>${new Date(p.criadoEm).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</time><span class="estado ${p.estado || 'pendente'}">${ESTADOS[p.estado] || 'Pendente'}</span></div>${p.contexto ? `<div class="contexto">${esc(p.contexto)}${p.avisado ? ' · Claude avisado' : ''}</div>` : ''}<div class="texto">${esc(p.texto)}</div>${p.resposta ? `<div class="resposta"><b>Claude:</b> ${esc(p.resposta)}</div>` : ''}</article>`).join('');
    el.scrollTop = el.scrollHeight;
  }
  let rascunho = []; // fallback sem db
  async function enviar(texto) {
    texto = texto.trim(); if (!texto) return;
    const ctxTxt = contexto ? `${contexto.rotulo} · ${fmt(contexto.t0)}–${fmt(contexto.t1)}` : `Momento ${fmt(t)} · formato ${formato}`;
    const id = 'p' + Date.now().toString(36);
    const doc = { id, texto, contexto: ctxTxt, alvo: contexto ? contexto.k : null, tempo: +t.toFixed(2), formato, criadoEm: new Date().toISOString(), estado: 'pendente', resposta: '', autor: meuId || '', avisado: false, threadId: '' };
    $('msg').value = ''; try { localStorage.removeItem('rascunho-msg'); } catch (e) {}
    // 1) avisa o Claude já, ainda dentro do gesto de quem clicou: vira um comentário que acorda a sessão
    let envio = null;
    if (comentarios && ouvindo === 'available') {
      const el = (selecionado && conteudo.querySelector(`[data-k="${selecionado}"]`)) || $('moldura');
      envio = comentarios.anchorFor(el).then(anchor => comentarios.sendToClaude({ anchor, text: `Pedido ${id} · ${ctxTxt}\n${texto}` })).catch(e => ({ erro: e }));
    }
    const MOTIVO = { consent_required: 'autorize os comentários para avisar o Claude', claude_unavailable: 'o Claude não está a ouvir agora', rate_limited: 'muitos envios seguidos, aguarde um pouco', forbidden: 'avisos ao Claude desligados nesta vista' };
    if (!db) {
      rascunho.push(doc); renderPedidos(rascunho);
      const r = envio ? await envio : null;
      if (r && !r.erro) { toast('Enviado ao Claude'); return; }
      try { await navigator.clipboard.writeText(`${ctxTxt}\n${texto}`); } catch (e) {} toast('Sem ligação: pedido copiado — cole no chat do Claude'); return;
    }
    try {
      const ref = db.collection('pedidos').doc(id); await ref.set(doc);
      if (envio) {
        const r = await envio;
        if (r && !r.erro) { await ref.update({ avisado: true, threadId: r.threadId }); toast('Pedido enviado — o Claude foi avisado'); }
        else { toast('Pedido guardado; ' + (MOTIVO[r?.erro?.code] || 'não deu para avisar o Claude') + '. Diga "veja os pedidos" no chat.'); atualizarOuvindo(); }
      } else toast('Pedido guardado — diga "veja os pedidos" no chat do Claude');
    }
    catch (e) { toast('Não foi guardado: ' + (e?.message || e?.code || 'erro')); $('msg').value = texto; }
  }
  $('compor').addEventListener('submit', e => { e.preventDefault(); enviar($('msg').value); });
  $('msg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar($('msg').value); } });
  $('msg').addEventListener('input', () => { try { localStorage.setItem('rascunho-msg', $('msg').value); } catch (e) {} });
  try { $('msg').value = localStorage.getItem('rascunho-msg') || ''; } catch (e) {}
  $('pedir-render').onclick = () => { const c = contexto; contexto = null; enviar(`Renderizar a versão final em ${formato}.`); contexto = c; };

  async function enviarFicheiros(fs) {
    if (!assets) return;
    for (const f of fs) {
      try {
        toast(`A enviar ${f.name}…`);
        const r = await assets.upload(f);
        const reg = { nome: f.name, tipo: r.contentType, tamanho: r.sizeBytes, assetId: r.id, url: r.url, criadoEm: new Date().toISOString() };
        if (db) await db.collection('ficheiros').add(reg); else { carregados.push(reg); montarFicheiros(); }
        toast(`${f.name} enviado`);
      } catch (e) { toast(`${f.name}: ${e?.code === 'too_large' ? 'ficheiro grande demais (máx. 20 MB)' : e?.code === 'unsupported_type' ? 'tipo não suportado' : (e?.message || 'erro')}`); }
    }
  }
  async function ligarCapacidades() {
    if (!window.claude?.use) { $('estado-db').textContent = 'offline'; renderPedidos([]); return; }
    const timer = setTimeout(() => { if (!db) { $('estado-db').textContent = 'sem ligação'; renderPedidos(rascunho); } }, 10000);
    [db, assets, user, comentarios] = await Promise.all([claude.use('db'), claude.use('assets'), claude.use('user'), claude.use('comments')]);
    clearTimeout(timer);
    podeCarregar = !!assets; montarFicheiros();
    if (user) { try { meuId = await user.id(); } catch (e) {} }
    if (!db) { $('estado-db').textContent = 'inicie sessão para guardar'; renderPedidos(rascunho); return; }
    $('estado-db').textContent = 'ligado'; atualizarOuvindo();
    $('msg').addEventListener('focus', atualizarOuvindo);
    db.collection('pedidos').orderBy('criadoEm').onSnapshot(s => renderPedidos(s.docs.map(d => d.data())), e => { $('estado-db').textContent = 'erro ao ler'; });
    db.collection('ficheiros').orderBy('criadoEm').onSnapshot(s => { carregados = s.docs.map(d => d.data()); montarFicheiros(); }, () => {});
  }

  /* ---------- UI geral ---------- */
  let legAtual = -1;
  function atualizarUI() {
    $('t-atual').textContent = fmt(t);
    const cab = $('cabeca'); if (cab) cab.style.left = (t * pps) + 'px';
    if (tocando) { const x = t * pps; if (x < trilhasEl.scrollLeft + 40 || x > trilhasEl.scrollLeft + trilhasEl.clientWidth - 60) trilhasEl.scrollLeft = x - 80; }
    const li = LEG.findIndex(l => t >= l.t0 && t < l.t1);
    if (li !== legAtual) {
      legAtual = li; document.querySelectorAll('.legenda-item.atual').forEach(e => e.classList.remove('atual'));
      const it = document.querySelector(`.legenda-item[data-i="${li}"]`); if (it) { it.classList.add('atual'); if (!$('aba-legendas').hidden && tocando) it.scrollIntoView({ block: 'nearest' }); }
      if (!selecionado) { inspetor(); if (!contexto) mostrarChip(); }
    }
  }
  document.querySelectorAll('.abas button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.abas button').forEach(x => x.setAttribute('aria-selected', x === b)); $('aba-ficheiros').hidden = b.dataset.aba !== 'ficheiros'; $('aba-legendas').hidden = b.dataset.aba !== 'legendas';
  });
  document.querySelectorAll('.formatos button').forEach(b => b.onclick = () => { formato = b.dataset.f; document.querySelectorAll('.formatos button').forEach(x => x.setAttribute('aria-pressed', x === b)); layoutTela(); });
  $('tocar').onclick = () => tocando ? parar() : tocar();
  $('voltar').onclick = () => irPara(t - 1); $('avancar').onclick = () => irPara(t + 1);
  $('som').onclick = () => { audio.muted = !audio.muted; $('som').setAttribute('aria-pressed', audio.muted); $('som').setAttribute('aria-label', audio.muted ? 'Ligar som' : 'Silenciar'); if (!audio.muted && tocando) { audio.currentTime = t; audio.play().catch(() => {}); } };
  $('seguro').onclick = () => { const on = !$('zona-segura').classList.contains('on'); $('zona-segura').classList.toggle('on', on); $('seguro').setAttribute('aria-pressed', on); };
  window.addEventListener('keydown', e => {
    if (e.target.closest('textarea, input')) return;
    if (e.code === 'Space') { e.preventDefault(); tocando ? parar() : tocar(); }
    if (e.key === 'ArrowLeft') irPara(t - (e.shiftKey ? 5 : 1)); if (e.key === 'ArrowRight') irPara(t + (e.shiftKey ? 5 : 1));
  });
  new ResizeObserver(() => { layoutTela(); const mn = ppsMin(); if (+$('zoom').value === 0 && Math.abs(pps - mn) > 1) { pps = mn; montarTimeline(); } }).observe(zona);

  /* ---------- arranque ---------- */
  M.ready.then(async () => {
    montarDados(); pronto = true; $('t-total').textContent = fmt(DUR);
    // miniaturas das cenas, tiradas do próprio motor
    const mc = document.createElement('canvas'); mc.width = 36; mc.height = 64; const mx = mc.getContext('2d');
    miniaturas = CENAS.map(c => { M.quadro((c.t0 + c.t1) / 2); mx.drawImage(tela, 0, 0, 36, 64); try { return mc.toDataURL('image/jpeg', 0.7); } catch (e) { return ''; } });
    t = CENAS[1] ? CENAS[1].t0 + 1.2 : 0;
    pps = ppsMin(); montarTimeline(); montarLegendas(); montarFicheiros(); mostrarChip(); inspetor(); layoutTela();
    try { PICOS = await (await fetch('audio/picos.json')).json(); desenharOnda(); } catch (e) {}
    ligarCapacidades();
  });
})();
</script>
