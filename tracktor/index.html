<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Tracktor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KINGDOM TRACKTOR — protótipo navegável.
   Design system: o da Kingdom Library («Kingdom UI»), tal como o Payflow o
   adaptou (cantos 16 px, Google Sans, pílulas), com a voz em AZUL e o chão
   em branco e cinza-azulado frio. Tokens descritos em DESIGN.md. */

:root{
  color-scheme:light;
  --canvas:#F2F5FA; --canvas-2:#E8EEF6;
  --surface:#FFFFFF; --surface-2:#F8FAFD; --sunken:#EDF1F7;
  --line:#E1E7F0; --line-strong:#CCD5E2;
  --ink:#0E1726; --ink-2:#2A3446; --muted:#5B6678; --faint:#8A94A6;

  /* A voz: o azul do logo, escurecido até o branco passar AA (5,0 a 6,6:1). */
  --azul-300:#7CC4FF; --azul-400:#2D8CF6; --azul-500:#0A6BE0;
  --azul-600:#005FCC; --azul-700:#004FB0;
  --azul-soft:#E8F1FE; --azul-soft-2:#D5E6FD; --azul-ink:#0B5CC7;
  --ciano:#00B0FF;

  --verde:#15803D; --verde-soft:#E3F6EA; --verde-ink:#0F7A37;
  --vermelho:#D42A39; --vermelho-soft:#FDE8EA; --vermelho-ink:#B4202D;
  --ambar:#D99A0B; --ambar-soft:#FFF4D9; --ambar-ink:#8A5B00;

  --cta:linear-gradient(180deg,#0A6BE0 0%,#0058C2 100%);
  --cta-hover:linear-gradient(180deg,#1474E8 0%,#0060D0 100%);
  --cta-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px -4px rgba(0,88,194,.45);
  /* O gradiente do ícone, tal como vem no ficheiro do logo. */
  --marca:linear-gradient(170deg,#0077F0 0%,#00B0FF 100%);
  --hero:linear-gradient(120deg,#004FB0 0%,#0A6BE0 55%,#2D8CF6 100%);

  --card-bg:#FFFFFF;
  --shadow-1:0 1px 2px rgba(14,23,38,.05), 0 6px 18px -8px rgba(14,23,38,.10);
  --shadow-2:0 2px 6px rgba(14,23,38,.06), 0 18px 40px -16px rgba(14,23,38,.22);
  --shadow-pop:0 12px 32px -8px rgba(14,23,38,.28), 0 2px 8px rgba(14,23,38,.08);
  --ring:0 0 0 3px rgba(10,107,224,.32);

  /* Séries dos gráficos, por ordem fixa (validadas para daltonismo). */
  --s1:#0A6BE0; --s2:#EB6834; --s3:#1BAF7A; --s4:#EDA100;
  --grid:#E7ECF3;

  --r-dialogo:20px; --r-cartao:16px; --r-dentro:12px;
  --r-campo:10px; --r-mini:8px; --r-chip:6px; --r-pilula:999px;

  --font:"Google Sans","Product Sans","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  --mono:"Google Sans Code",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --side:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#0A0F18; --canvas-2:#0F1622;
    --surface:#121A27; --surface-2:#111824; --sunken:#182233;
    --line:#1F2A3B; --line-strong:#2B384C;
    --ink:#EEF3FA; --ink-2:#CED7E4; --muted:#98A4B7; --faint:#6C788B;
    --azul-soft:#0F2747; --azul-soft-2:#15335C; --azul-ink:#86BEFF;
    --verde-soft:#123022; --verde-ink:#6FDC98;
    --vermelho-soft:#3A1A1D; --vermelho-ink:#FF8F98;
    --ambar-soft:#352A12; --ambar-ink:#F5C865;
    --card-bg:#121A27;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.7);
    --shadow-pop:0 12px 32px -8px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
    --ring:0 0 0 3px rgba(124,196,255,.45);
    --s1:#3D8CF0; --s2:#D95926; --s3:#199E70; --s4:#C98500;
    --grid:#1C2637;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0A0F18; --canvas-2:#0F1622;
  --surface:#121A27; --surface-2:#111824; --sunken:#182233;
  --line:#1F2A3B; --line-strong:#2B384C;
  --ink:#EEF3FA; --ink-2:#CED7E4; --muted:#98A4B7; --faint:#6C788B;
  --azul-soft:#0F2747; --azul-soft-2:#15335C; --azul-ink:#86BEFF;
  --verde-soft:#123022; --verde-ink:#6FDC98;
  --vermelho-soft:#3A1A1D; --vermelho-ink:#FF8F98;
  --ambar-soft:#352A12; --ambar-ink:#F5C865;
  --card-bg:#121A27;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.7);
  --shadow-pop:0 12px 32px -8px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
  --ring:0 0 0 3px rgba(124,196,255,.45);
  --s1:#3D8CF0; --s2:#D95926; --s3:#199E70; --s4:#C98500;
  --grid:#1C2637;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--canvas); color:var(--ink); font-family:var(--font);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
::selection{background:rgba(10,107,224,.2)}
h1,h2,h3,h4{margin:0; font-weight:500; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
a{color:var(--azul-ink); text-underline-offset:3px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:none; box-shadow:var(--ring)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono); font-size:.9em}
.muted{color:var(--muted)}
.ic{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; flex:none}
.ic.sm{width:15px; height:15px}
.ic.xs{width:13px; height:13px}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important} }

/* ---------- estrutura ---------- */
.app{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100%}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--surface);
  border-right:1px solid var(--line); padding:18px 14px 16px; display:flex; flex-direction:column; gap:18px; z-index:40}
.brand{display:flex; align-items:center; gap:11px; padding:2px 6px}
.logo-tile{width:38px; height:38px; border-radius:11px; background:var(--marca); color:#fff;
  display:grid; place-items:center; flex:none; box-shadow:0 6px 14px -6px rgba(0,119,240,.6)}
.logo-tile svg{width:70%; height:auto}
.mark path{fill:currentColor; stroke:currentColor; stroke-width:18; stroke-linejoin:round}
.brand-txt{display:flex; flex-direction:column; line-height:1.15}
.brand-txt small{font-size:11.5px; color:var(--muted)}
.brand-txt b{font-weight:500; font-size:17px; letter-spacing:-.02em}

.unit-btn{width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-dentro);
  border:1px solid var(--line); background:var(--surface-2); text-align:left; transition:border-color .2s}
.unit-btn:hover{border-color:var(--line-strong)}
.unit-dot{width:28px; height:28px; border-radius:8px; background:var(--azul-soft); color:var(--azul-ink);
  display:grid; place-items:center; font-size:11.5px; font-weight:500; flex:none}
.unit-btn span.t{display:flex; flex-direction:column; min-width:0; flex:1; line-height:1.25}
.unit-btn small{font-size:11.5px; color:var(--muted)}
.unit-btn b{font-weight:500; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.menu{position:absolute; z-index:60; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-dentro);
  box-shadow:var(--shadow-pop); padding:6px; min-width:236px}
.menu button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:8px 10px;
  border-radius:var(--r-mini); text-align:left; font-size:13.5px}
.menu button:hover{background:var(--sunken)}
.menu button.on{background:var(--azul-soft); color:var(--azul-ink)}
.menu hr{border:0; border-top:1px solid var(--line); margin:6px 4px}

.nav{display:flex; flex-direction:column; gap:2px}
.nav-lbl{font-size:11.5px; color:var(--muted); padding:10px 10px 4px; letter-spacing:.02em}
.nav a{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:var(--r-campo); color:var(--ink-2);
  text-decoration:none; font-size:14px; transition:background .15s}
.nav a:hover{background:var(--sunken)}
.nav a.on{background:var(--azul-soft); color:var(--azul-ink); font-weight:500}
.nav a .count{margin-left:auto; font-size:11.5px; background:var(--azul-500); color:#fff; border-radius:var(--r-pilula);
  padding:1px 7px; font-weight:500}
.nav a.on .count{background:var(--azul-600)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px}
.sync{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); padding:8px 10px;
  border-radius:var(--r-campo); background:var(--surface-2); border:1px solid var(--line)}
.sync b{color:var(--ink); font-weight:500}
.dot{width:8px; height:8px; border-radius:50%; background:var(--verde); flex:none}
.dot.ambar{background:var(--ambar)} .dot.vermelho{background:var(--vermelho)}

.nav-scrim{display:none}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:12px 28px;
  background:color-mix(in srgb, var(--canvas) 88%, transparent); backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topbar .burger{display:none}
.search{flex:1; max-width:420px; position:relative}
.search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.search input{width:100%; height:38px; border-radius:var(--r-pilula); border:1px solid var(--line); background:var(--surface);
  padding:0 14px 0 38px; font-size:13.5px}
.search input::placeholder{color:var(--faint)}
.top-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center; color:var(--ink-2); position:relative; flex:none}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn .badge{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--vermelho);
  border:2px solid var(--surface)}
.avatar{width:36px; height:36px; border-radius:50%; background:var(--azul-soft-2); color:var(--azul-ink); display:grid;
  place-items:center; font-weight:500; font-size:13px; flex:none}
.avatar.sm{width:30px; height:30px; font-size:12px}
.avatar.lg{width:52px; height:52px; font-size:17px}

.page{padding:26px 28px 64px; width:100%; max-width:1440px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.page-h{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.page-h h1{font-size:clamp(24px,2.6vw,30px); letter-spacing:-.025em; line-height:1.2}
.page-h p{color:var(--muted); margin-top:4px}
.page-h .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.crumb{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; text-decoration:none;
  border:0; background:none; padding:0; margin-bottom:6px}
.crumb:hover{color:var(--azul-ink)}

/* ---------- componentes ---------- */
.btn{height:40px; padding:0 18px; border-radius:var(--r-pilula); border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:8px;
  white-space:nowrap; transition:background .15s, border-color .15s, box-shadow .2s, transform .1s}
.btn:hover{border-color:var(--line-strong); background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta); border-color:transparent; color:#fff; box-shadow:var(--cta-shadow)}
.btn.primary:hover{background:var(--cta-hover)}
.btn.quiet{border-color:transparent; background:none; color:var(--azul-ink); padding:0 10px}
.btn.quiet:hover{background:var(--azul-soft)}
.btn.sm{height:32px; padding:0 13px; font-size:12.5px}
.btn.white{background:#fff; color:#0A4FA8; border-color:transparent}
.btn.white:hover{background:#EAF3FF}
.btn.on-blue{background:transparent; color:#fff; border-color:rgba(255,255,255,.55)}
.btn.on-blue:hover{background:rgba(255,255,255,.12)}
.btn.danger{color:var(--vermelho-ink)}

.pill{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:var(--r-pilula);
  font-size:12px; font-weight:500; white-space:nowrap; background:var(--sunken); color:var(--ink-2)}
.pill.azul{background:var(--azul-soft); color:var(--azul-ink)}
.pill.verde{background:var(--verde-soft); color:var(--verde-ink)}
.pill.ambar{background:var(--ambar-soft); color:var(--ambar-ink)}
.pill.vermelho{background:var(--vermelho-soft); color:var(--vermelho-ink)}
.pill.solid{background:var(--azul-500); color:#fff}
.pill .dot{width:6px; height:6px}
.delta{font-size:12px; font-weight:500; display:inline-flex; align-items:center; gap:2px}
.delta.up{color:var(--verde-ink)} .delta.down{color:var(--vermelho-ink)}

.card{background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-cartao); box-shadow:var(--shadow-1);
  min-width:0}
.card-h{display:flex; align-items:flex-start; gap:12px; padding:18px 22px 0}
.card-h h2{font-size:16.5px; letter-spacing:-.015em}
.card-h p{font-size:12.5px; color:var(--muted); margin-top:2px}
.card-h .acts{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.card-b{padding:16px 22px 20px}
.card-b.flush{padding:12px 0 6px}

.seg{display:inline-flex; background:var(--sunken); border-radius:var(--r-pilula); padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; height:30px; padding:0 14px; border-radius:var(--r-pilula); font-size:13px;
  color:var(--muted); font-weight:500; display:inline-flex; align-items:center; gap:6px}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(14,23,38,.12)}
.seg.sm button{height:26px; padding:0 11px; font-size:12.5px}

.chip{display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px 0 6px; border-radius:var(--r-pilula);
  border:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--ink-2)}
.chip.on{border-color:var(--azul-500); background:var(--azul-soft); color:var(--azul-ink)}
.chip.plain{padding:0 12px}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}

.net{--c:var(--s1); width:24px; height:24px; border-radius:7px; display:inline-grid; place-items:center; flex:none;
  background:color-mix(in srgb, var(--c) 18%, var(--surface)); color:var(--ink)}
.net .ic{width:14px; height:14px; stroke-width:2}
.net.n-fb{--c:var(--s1)} .net.n-ig{--c:var(--s2)} .net.n-li{--c:var(--s3)} .net.n-tt{--c:var(--s4)}
.net.n-wa{--c:#25A55F} .net.n-ms{--c:var(--s1)}
.net.xs{width:20px; height:20px; border-radius:6px}
.net.xs .ic{width:12px; height:12px}
.nets{display:inline-flex; gap:4px}

.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > span{font-size:13px; font-weight:500; color:var(--ink-2)}
.field small{font-size:12px; color:var(--muted)}
.inp, .field input, .field select, .field textarea{width:100%; min-height:42px; border-radius:var(--r-campo);
  border:1px solid var(--line-strong); background:var(--surface); padding:9px 12px; font-size:14px;
  transition:border-color .15s, box-shadow .15s}
.field textarea{resize:vertical; min-height:110px; line-height:1.5}
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--azul-500); box-shadow:var(--ring)}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row > *{flex:1 1 160px}
.check{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; cursor:pointer}
.check input{width:18px; height:18px; accent-color:var(--azul-500); margin:1px 0 0; flex:none}

.switch{position:relative; width:40px; height:24px; flex:none}
.switch input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.switch i{position:absolute; inset:0; border-radius:var(--r-pilula); background:var(--line-strong); transition:background .2s}
.switch i::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s var(--ease)}
.switch input:checked + i{background:var(--azul-500)}
.switch input:checked + i::after{transform:translateX(16px)}
.switch input:focus-visible + i{box-shadow:var(--ring)}
.switch input:disabled + i{opacity:.6}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; font-weight:500; font-size:12px; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line);
  white-space:nowrap; background:var(--surface-2)}
.tbl td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right; font-variant-numeric:tabular-nums}
.tbl tbody tr.click{cursor:pointer; transition:background .12s}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl td.nm{min-width:210px}
.tbl td.nm b{font-weight:500; display:block}
.tbl td.nm small{color:var(--muted); font-size:12px}
.tbl tfoot td{font-weight:500; border-top:1px solid var(--line-strong); background:var(--surface-2)}

.meter{height:6px; border-radius:var(--r-pilula); background:var(--sunken); overflow:hidden; min-width:80px}
.meter i{display:block; height:100%; border-radius:inherit; background:var(--azul-500)}
.meter.ambar i{background:var(--ambar)}

.score{display:inline-flex; align-items:center; gap:8px}
.score .meter{width:64px; min-width:64px}
.score b{font-weight:500; font-variant-numeric:tabular-nums; min-width:22px}
.score.quente .meter i{background:var(--vermelho)}
.score.morno .meter i{background:var(--ambar)}
.score.frio .meter i{background:var(--azul-400)}

.grid{display:grid; gap:18px}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.kpi{padding:16px 18px 14px; display:flex; flex-direction:column; gap:6px}
.kpi-l{font-size:12.5px; color:var(--muted)}
.kpi-v{font-size:24px; font-weight:500; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi-f{display:flex; align-items:flex-end; justify-content:space-between; gap:8px}
.kpi-f small{font-size:11.5px; color:var(--muted)}
.spark{display:block}

.stats{display:flex; flex-wrap:wrap; gap:0; background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-cartao);
  box-shadow:var(--shadow-1)}
.stats > div{flex:1 1 150px; padding:14px 20px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px}
.stats > div:last-child{border-right:0}
.stats small{font-size:12px; color:var(--muted)}
.stats b{font-size:19px; font-weight:500; letter-spacing:-.02em; font-variant-numeric:tabular-nums}

/* ---------- o herói (a única coisa ousada: o azul do logo) ---------- */
.hero{position:relative; overflow:hidden; border-radius:var(--r-cartao); background:var(--hero); color:#fff;
  padding:26px 28px; display:flex; gap:24px; min-height:210px; isolation:isolate}
.hero-art{position:absolute; right:-40px; top:-60px; width:520px; height:auto; z-index:-1; opacity:.22; color:#fff}
.hero-txt{display:flex; flex-direction:column; gap:6px; max-width:560px}
.hero-k{font-size:13.5px; opacity:.92}
.hero-v{font-size:clamp(32px,4.2vw,46px); font-weight:500; letter-spacing:-.035em; line-height:1.05}
.hero-s{font-size:13.5px; opacity:.92}
.hero-acts{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.hero-side{margin-left:auto; align-self:flex-end; display:flex; flex-direction:column; gap:8px; min-width:250px}
.hero-card{background:#fff; color:#0E1726; border-radius:var(--r-dentro); padding:12px 14px; display:flex; align-items:center;
  gap:10px; font-size:12.5px; box-shadow:0 10px 30px -12px rgba(0,30,80,.5)}
.hero-card b{font-weight:500; display:block; font-size:13px}
.hero-card small{color:#5B6678}
.hero-spark{margin-top:10px}

/* ---------- gráficos ---------- */
.chart{position:relative; width:100%}
.chart svg{display:block; overflow:visible}
.chart text{fill:var(--muted); font-size:11px; font-family:var(--font)}
.chart .gl{stroke:var(--grid); stroke-width:1}
.chart .base{stroke:var(--line-strong); stroke-width:1}
.chart .hit{fill:transparent; cursor:crosshair}
.chart .hit:hover + .hl, .chart .hl{pointer-events:none}
.chart .guide{stroke:var(--ink); stroke-opacity:.35; stroke-width:1; stroke-dasharray:3 3}
.chart .hdot{stroke:var(--surface); stroke-width:2}
.chart .end-lbl{fill:var(--ink-2); font-size:11.5px; font-weight:500}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}

.hb{display:flex; flex-direction:column; gap:10px}
.hb-row{display:grid; grid-template-columns:minmax(110px,160px) minmax(0,1fr) auto; gap:12px; align-items:center; font-size:13px}
.hb-row .lb{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hb-row .lb small{display:block; color:var(--muted); font-size:11.5px}
.hb-track{height:12px; border-radius:0 4px 4px 0; background:var(--sunken); position:relative}
.hb-track i{position:absolute; left:0; top:0; bottom:0; border-radius:0 4px 4px 0; background:var(--s1)}
.hb-row .v{font-variant-numeric:tabular-nums; font-weight:500; text-align:right; min-width:64px}
.hb-row .v small{display:block; font-weight:400; color:var(--muted); font-size:11.5px}

.funnel{display:flex; flex-direction:column; gap:4px}
.fn-row{display:grid; grid-template-columns:118px minmax(0,1fr); gap:12px; align-items:center}
.fn-row .lb{font-size:13px; color:var(--ink-2)}
.fn-bar{height:30px; border-radius:0 6px 6px 0; background:var(--s1); display:flex; align-items:center; padding:0 10px;
  color:#fff; font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums; min-width:62px}
.fn-step{margin-left:130px; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:4px; height:16px}

.tip{position:fixed; z-index:100; pointer-events:none; background:var(--ink); color:var(--surface); border-radius:var(--r-campo);
  padding:9px 12px; font-size:12.5px; line-height:1.45; box-shadow:var(--shadow-pop); max-width:280px}
.tip b{font-weight:500}
.tip .tr{display:flex; align-items:center; gap:8px; justify-content:space-between}
.tip .tr span{display:inline-flex; align-items:center; gap:6px}
.tip i{width:8px; height:8px; border-radius:2px; display:inline-block}
.tip .tt{font-weight:500; margin-bottom:4px}

/* ---------- listas ---------- */
.list{display:flex; flex-direction:column}
.li{display:flex; align-items:center; gap:12px; padding:11px 22px; border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{min-width:0; flex:1}
.li .t b{font-weight:500; display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.li .t small{color:var(--muted); font-size:12px}
.when{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}

/* ---------- calendário ---------- */
.week{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px; overflow-x:auto; padding-bottom:4px}
.day{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-dentro); min-height:420px;
  display:flex; flex-direction:column}
.day.today{border-color:var(--azul-500); background:var(--azul-soft)}
.day-h{display:flex; align-items:baseline; gap:6px; padding:10px 12px 8px; font-size:12.5px; color:var(--muted)}
.day-h b{font-size:18px; color:var(--ink); font-weight:500; letter-spacing:-.02em}
.day.today .day-h b{color:var(--azul-ink)}
.day-b{display:flex; flex-direction:column; gap:8px; padding:0 8px 8px}
.post{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-campo); padding:9px 10px;
  display:flex; flex-direction:column; gap:6px; text-align:left; font-size:12.5px; transition:border-color .15s, box-shadow .15s; width:100%}
.post:hover{border-color:var(--line-strong); box-shadow:var(--shadow-1)}
.post .ph{display:flex; align-items:center; gap:6px; justify-content:space-between}
.post .tm{font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink)}
.post .ptl{color:var(--ink-2); line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.post .pill{height:20px; font-size:11px; padding:0 8px}
.add-slot{border:1px dashed var(--line-strong); background:none; border-radius:var(--r-campo); height:34px; color:var(--muted);
  font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px}
.add-slot:hover{border-color:var(--azul-500); color:var(--azul-ink)}
.month{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--r-dentro);
  overflow:hidden; background:var(--line); gap:1px}
.month .mh{background:var(--surface-2); font-size:12px; color:var(--muted); padding:8px 10px}
.month .mc{background:var(--surface); min-height:104px; padding:6px 8px; display:flex; flex-direction:column; gap:3px; font-size:11.5px}
.month .mc.out{background:var(--surface-2); color:var(--faint)}
.month .mc.today{box-shadow:inset 0 0 0 2px var(--azul-500)}
.month .mc > b{font-weight:500; font-size:12.5px}
.month .mp{display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink-2)}
.month .mp i{width:6px; height:6px; border-radius:50%; flex:none}
.heat{display:grid; grid-template-columns:40px repeat(6,minmax(0,1fr)); gap:4px; font-size:11.5px; color:var(--muted)}
.heat .hc{height:30px; border-radius:6px}
.heat .hc.best{box-shadow:inset 0 0 0 2px var(--ink)}
.heat .hl{display:flex; align-items:center}
.heat .hh{text-align:center}

/* ---------- conversas ---------- */
.inbox{display:grid; grid-template-columns:330px minmax(0,1fr) 310px; height:calc(100vh - 150px); min-height:580px; overflow:hidden; padding:0}
.ib-list{border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.ib-tools{padding:14px 14px 10px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line)}
.ib-scroll{overflow-y:auto; flex:1}
.conv{display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line); width:100%; text-align:left; background:none;
  border-left:0; border-right:0; border-top:0; position:relative}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--azul-soft)}
.conv .av{position:relative}
.conv .av .net{position:absolute; right:-4px; bottom:-4px; box-shadow:0 0 0 2px var(--surface)}
.conv .t{flex:1; min-width:0}
.conv .t b{font-weight:500; font-size:13.5px; display:flex; gap:6px; align-items:center}
.conv .t b span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.conv .t p{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.conv.unread .t p{color:var(--ink-2)}
.conv .meta{display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.conv .n{background:var(--azul-500); color:#fff; font-size:11px; font-weight:500; border-radius:var(--r-pilula); padding:0 6px; min-width:18px; text-align:center}
.ib-thread{display:flex; flex-direction:column; min-height:0; min-width:0}
.th-h{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line)}
.th-h .t b{font-weight:500; display:block}
.th-h .t small{color:var(--muted); font-size:12px}
.th-h .acts{margin-left:auto; display:flex; gap:6px}
.msgs{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2)}
.msg{max-width:74%; padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.45; background:var(--surface);
  border:1px solid var(--line); align-self:flex-start}
.msg.me{align-self:flex-end; background:var(--azul-500); color:#fff; border-color:transparent}
.msg small{display:block; font-size:11px; opacity:.72; margin-top:3px}
.sys{align-self:center; font-size:12px; color:var(--muted); background:var(--surface); border:1px dashed var(--line-strong);
  border-radius:var(--r-pilula); padding:4px 12px; display:inline-flex; gap:6px; align-items:center; text-align:center}
.reply{border-top:1px solid var(--line); padding:12px 14px; display:flex; flex-direction:column; gap:8px; background:var(--surface)}
.reply .qr{display:flex; gap:6px; flex-wrap:wrap}
.reply .box{display:flex; gap:8px; align-items:flex-end}
.reply textarea{flex:1; resize:none; min-height:44px; max-height:140px; border-radius:var(--r-dentro); border:1px solid var(--line-strong);
  padding:11px 12px; background:var(--surface); font-size:13.5px}
.reply textarea:focus{outline:none; border-color:var(--azul-500); box-shadow:var(--ring)}
.ib-side{border-left:1px solid var(--line); overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:16px}
.kv{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; text-align:right; overflow-wrap:anywhere}
.sec-t{font-size:12px; color:var(--muted); font-weight:500; margin-bottom:8px}

/* ---------- leads ---------- */
.board{display:grid; grid-template-columns:repeat(6,minmax(230px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-dentro); display:flex; flex-direction:column; min-height:360px}
.col-h{display:flex; align-items:center; gap:8px; padding:11px 12px; font-size:13px; font-weight:500}
.col-h .c{margin-left:auto; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums}
.col-b{display:flex; flex-direction:column; gap:8px; padding:0 8px 10px}
.lc{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-campo); padding:11px; text-align:left;
  display:flex; flex-direction:column; gap:8px; width:100%}
.lc:hover{border-color:var(--line-strong); box-shadow:var(--shadow-1)}
.lc b{font-weight:500; font-size:13.5px}
.lc small{color:var(--muted); font-size:12px}
.lc .f{display:flex; align-items:center; justify-content:space-between; gap:6px}
.payflow-tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--azul-ink); font-weight:500}

.rule{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule b{font-weight:500; font-size:13.5px}
.rule small{display:block; color:var(--muted); font-size:12px}
.pts{font-weight:500; font-variant-numeric:tabular-nums; font-size:13px; min-width:44px; text-align:right}
.pts.pos{color:var(--verde-ink)} .pts.neg{color:var(--vermelho-ink)}
.thr{display:flex; height:10px; border-radius:var(--r-pilula); overflow:hidden; gap:2px}
.thr i{display:block; height:100%}
.auto{display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-top:1px solid var(--line)}
.auto:first-child{border-top:0}
.auto .t{flex:1}
.auto .t b{font-weight:500; font-size:13.5px; display:block}
.auto .t p{font-size:13px; color:var(--muted); margin-top:2px}
.auto .ic-w{width:34px; height:34px; border-radius:10px; background:var(--azul-soft); color:var(--azul-ink); display:grid; place-items:center; flex:none}

/* ---------- gaveta e diálogos ---------- */
.scrim{position:fixed; inset:0; background:rgba(8,14,26,.42); z-index:80; animation:fade .2s var(--ease)}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(520px,100%); background:var(--surface); z-index:90; box-shadow:var(--shadow-pop);
  display:flex; flex-direction:column; animation:slide .28s var(--ease)}
.drawer-h{display:flex; gap:14px; align-items:flex-start; padding:20px 22px 14px; border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:20px; letter-spacing:-.02em}
.drawer-h p{color:var(--muted); font-size:13px}
.drawer-b{overflow-y:auto; padding:18px 22px 28px; display:flex; flex-direction:column; gap:20px; flex:1}
.drawer-f{padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.modal-w{position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:20px; overflow-y:auto}
.modal{background:var(--surface); border-radius:var(--r-dialogo); box-shadow:var(--shadow-pop); width:min(560px,100%); max-height:calc(100vh - 40px);
  display:flex; flex-direction:column; animation:pop .25s var(--ease); position:relative; z-index:91}
.modal.wide{width:min(1080px,100%)}
.modal-h{display:flex; align-items:flex-start; gap:12px; padding:20px 24px 12px}
.modal-h h2{font-size:21px; letter-spacing:-.02em}
.modal-h p{color:var(--muted); font-size:13.5px; margin-top:4px}
.modal-h .x{margin-left:auto}
.modal-b{padding:6px 24px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px}
.modal-f{padding:14px 24px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:wrap}
.modal-f .hint{margin-right:auto; font-size:12.5px; color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px); opacity:.4}}
@keyframes pop{from{transform:translateY(8px) scale(.985); opacity:0}}

.note{display:flex; gap:10px; padding:12px 14px; border-radius:var(--r-dentro); font-size:13px; line-height:1.45; align-items:flex-start}
.note.azul{background:var(--azul-soft); color:var(--azul-ink)}
.note.ambar{background:var(--ambar-soft); color:var(--ambar-ink)}
.note.vermelho{background:var(--vermelho-soft); color:var(--vermelho-ink)}
.note.verde{background:var(--verde-soft); color:var(--verde-ink)}
.note b{font-weight:500}
.note .ic{margin-top:1px}

.utm{font-family:var(--mono); font-size:12.5px; background:var(--sunken); border-radius:var(--r-campo); padding:10px 12px;
  overflow-wrap:anywhere; color:var(--ink-2); line-height:1.55}
.utm em{font-style:normal; color:var(--azul-ink)}

.timeline{display:flex; flex-direction:column; gap:0; position:relative}
.tl{display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; padding-bottom:14px; position:relative}
.tl::before{content:""; position:absolute; left:13px; top:26px; bottom:0; width:2px; background:var(--line)}
.tl:last-child::before{display:none}
.tl .b{width:28px; height:28px; border-radius:50%; background:var(--sunken); color:var(--ink-2); display:grid; place-items:center}
.tl .b.azul{background:var(--azul-soft); color:var(--azul-ink)}
.tl .b.verde{background:var(--verde-soft); color:var(--verde-ink)}
.tl b{font-weight:500; font-size:13.5px}
.tl p{font-size:12.5px; color:var(--muted)}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:120; background:var(--ink); color:var(--surface);
  border-radius:var(--r-pilula); padding:11px 18px; font-size:13.5px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-pop);
  animation:pop .25s var(--ease); max-width:calc(100% - 32px)}
.toast .ic{color:#6FDC98}

/* ---------- composer ---------- */
.composer{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:22px}
.drop{border:1.5px dashed var(--line-strong); border-radius:var(--r-dentro); padding:16px; display:flex; align-items:center; gap:12px;
  font-size:13px; color:var(--muted); background:var(--surface-2); cursor:pointer}
.drop:hover{border-color:var(--azul-500)}
.drop input{display:none}
.counters{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.counters span{display:inline-flex; gap:5px; align-items:center}
.prev{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-cartao); padding:14px; display:flex; flex-direction:column; gap:12px}
.pv{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-dentro); overflow:hidden; max-width:360px; width:100%; margin:0 auto}
.pv-h{display:flex; align-items:center; gap:9px; padding:10px 12px; font-size:13px}
.pv-h b{font-weight:500}
.pv-img{aspect-ratio:1/1; max-width:100%; background:var(--hero); color:#fff; display:flex; flex-direction:column; justify-content:flex-end;
  padding:22px; position:relative; overflow:hidden; isolation:isolate}
.pv-img.pv-li{aspect-ratio:1.91/1}
.pv-img.pv-tt{aspect-ratio:9/12}
.pv-img svg{position:absolute; right:-30px; top:-20px; width:78%; opacity:.2; z-index:-1}
.pv-img strong{font-size:22px; font-weight:500; letter-spacing:-.02em; line-height:1.15; max-width:88%}
.pv-img span{font-size:12px; opacity:.9; margin-top:6px}
.pv-c{padding:10px 12px 12px; font-size:12.5px; line-height:1.45; white-space:pre-wrap; color:var(--ink-2); max-height:130px; overflow:hidden}

/* ---------- formulários ---------- */
.fb{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start}
.q{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-dentro);
  background:var(--surface); width:100%; text-align:left}
.q:hover{border-color:var(--line-strong)}
.q.on{border-color:var(--azul-500); box-shadow:var(--ring)}
.q .n{width:26px; height:26px; border-radius:8px; background:var(--sunken); display:grid; place-items:center; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
.q .t{flex:1; min-width:0}
.q .t b{font-weight:500; font-size:13.5px; display:block}
.q .t small{color:var(--muted); font-size:12px}
.q .grip{color:var(--faint)}
.qs{display:flex; flex-direction:column; gap:8px}
.opt{display:grid; grid-template-columns:minmax(0,1fr) 84px; gap:8px; align-items:center}
.opt .inp{min-height:36px; padding:6px 10px; font-size:13px}
.phone{width:300px; max-width:100%; margin:0 auto; border-radius:34px; border:8px solid #0E1726; background:#fff; color:#0E1726;
  min-height:520px; padding:30px 22px 22px; display:flex; flex-direction:column; gap:14px}
.phone .pb{height:4px; border-radius:4px; background:#E1E7F0; overflow:hidden}
.phone .pb i{display:block; height:100%; background:#0A6BE0}
.phone h3{font-size:21px; letter-spacing:-.02em; line-height:1.25}
.phone p{font-size:13px; color:#5B6678}
.phone .po{border:1px solid #CCD5E2; border-radius:12px; padding:11px 14px; font-size:13.5px; text-align:left; background:#fff; color:#0E1726}
.phone .po.on{border-color:#0A6BE0; background:#E8F1FE}

/* ---------- integrações ---------- */
.flow{display:grid; grid-template-columns:minmax(0,1fr) 36px minmax(0,1.1fr) 36px minmax(0,1fr) 36px minmax(0,1fr); align-items:center; gap:0}
.fnode{border:1px solid var(--line); border-radius:var(--r-dentro); padding:14px; background:var(--surface); display:flex; flex-direction:column; gap:8px; height:100%}
.fnode.core{border-color:var(--azul-500); background:var(--azul-soft)}
.fnode h3{font-size:14.5px; display:flex; align-items:center; gap:8px}
.fnode ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--ink-2)}
.fnode li{display:flex; align-items:center; gap:7px}
.farrow{display:grid; place-items:center; color:var(--azul-500)}
.integ{display:flex; flex-direction:column; gap:12px; padding:18px}
.integ-h{display:flex; align-items:center; gap:12px}
.integ-h .lg{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; font-weight:500; font-size:15px}
.integ-h b{font-weight:500; display:block}
.integ p{font-size:13px; color:var(--muted)}
.integ ul{margin:0; padding:0; list-style:none; font-size:12.5px; display:flex; flex-direction:column; gap:4px; color:var(--ink-2)}
.integ ul li{display:flex; gap:7px; align-items:center}
.integ .f{display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:4px}

/* ---------- design system ---------- */
.sw{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.sw div{border:1px solid var(--line); border-radius:var(--r-dentro); overflow:hidden; font-size:12px; background:var(--surface)}
.sw i{display:block; height:58px}
.sw span{display:block; padding:8px 10px}
.sw b{font-weight:500; display:block; font-size:12.5px}
.sw code{font-family:var(--mono); color:var(--muted)}
.ts > div{display:grid; grid-template-columns:130px minmax(0,1fr); gap:14px; align-items:baseline; padding:10px 0; border-top:1px solid var(--line)}
.ts > div:first-child{border-top:0}
.ts small{color:var(--muted); font-size:12px}
.radii{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
.radii div{display:flex; flex-direction:column; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.radii i{width:64px; height:64px; background:var(--azul-soft); border:1.5px solid var(--azul-500)}
.logos{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.logos > div{border-radius:var(--r-cartao); min-height:200px; display:grid; place-items:center; border:1px solid var(--line)}
.lockup{display:flex; align-items:center; gap:14px}
.lockup b{font-size:26px; font-weight:500; letter-spacing:-.03em}
.lockup small{display:block; font-size:13px; font-weight:400; opacity:.8; letter-spacing:0}

/* ---------- responsivo ---------- */
@media (max-width:1320px){
  .g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .inbox{grid-template-columns:300px minmax(0,1fr)}
  .ib-side{display:none}
  .inbox.show-side{grid-template-columns:300px minmax(0,1fr) 290px}
  .inbox.show-side .ib-side{display:flex}
}
@media (max-width:1100px){
  .g-2-1, .g-3{grid-template-columns:minmax(0,1fr)}
  .fb{grid-template-columns:minmax(0,1fr)}
  .composer{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr); gap:6px}
  .farrow{transform:rotate(90deg); height:28px}
  .hero-side{display:none}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed; left:0; top:0; bottom:0; width:280px; transform:translateX(-102%); transition:transform .28s var(--ease); box-shadow:var(--shadow-pop)}
  .app.nav-open .side{transform:none}
  .app.nav-open .nav-scrim{display:block}
  .nav-scrim{display:none; position:fixed; inset:0; background:rgba(8,14,26,.42); z-index:35}
  .topbar .burger{display:grid}
  .topbar{padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top, 0px))}
  .page{padding:18px 16px 56px}
  .inbox, .inbox.show-side{grid-template-columns:minmax(0,1fr); height:auto; min-height:0}
  .inbox .ib-thread, .inbox .ib-side{display:none}
  .inbox.pane-thread .ib-list{display:none}
  .inbox.pane-thread .ib-thread{display:flex; height:calc(100vh - 120px)}
  .inbox.pane-side .ib-list, .inbox.pane-side .ib-thread{display:none}
  .inbox.pane-side .ib-side{display:flex}
  .g-1-1{grid-template-columns:minmax(0,1fr)}
  .logos{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:14px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{display:none}
  .hero{padding:22px 20px}
  .hero-art{width:380px; right:-120px}
  .card-h{padding:16px 16px 0}
  .card-b{padding:14px 16px 16px}
  .li{padding:11px 16px}
  .hb-row{grid-template-columns:minmax(90px,110px) minmax(0,1fr) auto; gap:8px}
  .fn-row{grid-template-columns:92px minmax(0,1fr)}
  .fn-step{margin-left:104px}
  .stats > div{flex-basis:45%; border-right:0; border-bottom:1px solid var(--line)}
  .page-h .acts{margin-left:0}
  .modal-h, .modal-b, .modal-f{padding-left:18px; padding-right:18px}
  .top-right .hide-sm{display:none}
}

function rng(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function espalhar(total, n, seed, subida = .35){
  const r = rng(seed); const w = Array.from({ length:n }, (_, i) => {
    const dow = (i + 3) % 7; const fds = dow >= 5 ? .72 : 1;
    return (1 + subida * i / n) * fds * (.65 + r() * .7);
  });
  const s = w.reduce((a, b) => a + b, 0); const out = w.map(x => Math.floor(x / s * total));
  let resto = total - out.reduce((a, b) => a + b, 0); let i = n - 1;
  while (resto > 0){ out[i] += 1; resto--; i = (i - 3 + n) % n; }
  return out;
}

function niceMax(v){
  if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

    const y = pad.t + ih - t * ih;
    g += `<line class="${t ? 'gl' : 'base'}" x1="${pad.l}" x2="${pad.l + iw}" y1="${y}" y2="${y}"/>`;
    if (t === 0 || t === .5 || t === 1) g += `<text x="${pad.l - 8}" y="${y + 3.5}" text-anchor="end">${fmt(max * t)}</text>`;
  }); return g;
}
function eixoX(labels, pad, bw, h, iw){
  const passo = Math.ceil(labels.length / Math.max(2, Math.floor(iw / 64))); let g = '';
  labels.forEach((l, i) => { if (i % passo === 0 || i === labels.length - 1 && (labels.length - 1) % passo > passo / 2)
    g += `<text x="${pad.l + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });
  return g;
}
function barrasEmpilhadas(w, h, labels, series, { fmt = mz, titulo = i => labels[i] } = {}){
  const pad = { l:40, r:6, t:10, b:24 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const tot = labels.map((_, i) => series.reduce((s, se) => s + se.v[i], 0));
  const max = niceMax(Math.max(...tot) * 1.05); const bw = iw / labels.length; const barW = Math.max(3, Math.min(20, bw * .62));
  let g = eixoY(max, pad, iw, ih, fmt);
  labels.forEach((_, i) => {
    let y = pad.t + ih; const x = pad.l + i * bw + (bw - barW) / 2;
    series.forEach((se, si) => {
      const hh = se.v[i] / max * ih; if (hh <= 0) return;
      const ultimo = series.slice(si + 1).every(s2 => !s2.v[i]);
      const gap = si > 0 ? 2 : 0; y -= hh;
      g += ultimo ? `<path d="${topoRedondo(x, y, barW, hh - gap, 3)}" style="fill:${se.cor}"/>`
                  : `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0, hh - gap)}" style="fill:${se.cor}"/>`;
    });
    const t = tip(`<div class="tt">${esc(titulo(i))}</div>` + series.map(se => `<div class="tr"><span><i style="background:${se.cor}"></i>${esc(se.nome)}</span><b>${fmt(se.v[i])}</b></div>`).join('')
      + `<div class="tr" style="margin-top:3px;opacity:.8"><span>Total</span><b>${fmt(tot[i])}</b></div>`);
    g += `<rect class="hit" data-tip="${t}" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${ih}"/>`;
  });
  g += eixoX(labels, pad, bw, h, iw);
  return `<svg width="${w}" height="${h}" role="img">${g}</svg>`;
}
function barras(w, h, labels, v, { fmt = mz, cor = 'var(--s1)', titulo = i => labels[i], unidade = '' } = {}){
  return barrasEmpilhadas(w, h, labels, [{ nome:unidade || 'Valor', cor, v }], { fmt, titulo });
}
function linhas(w, h, labels, series, { fmt = mz, titulo = i => labels[i] } = {}){
  const pad = { l:44, r:92, t:12, b:24 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = niceMax(Math.max(...series.flatMap(s => s.v)) * 1.05); const n = labels.length;
  const X = i => pad.l + (n === 1 ? iw / 2 : i / (n - 1) * iw), Y = v => pad.t + ih - v / max * ih;
  let g = eixoY(max, pad, iw, ih, fmt);
  series.forEach(se => {
    const d = se.v.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    g += `<path d="${d}" style="fill:none;stroke:${se.cor};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  });
  /* rótulos diretos no fim de cada linha, afastados para não se tocarem */
  const fins = series.map(se => ({ se, y:Y(se.v[n - 1]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 15) fins[i].y = fins[i - 1].y + 15;
  fins.forEach(f => {
    g += `<circle cx="${X(n - 1)}" cy="${Y(f.se.v[n - 1])}" r="4" class="hdot" style="fill:${f.se.cor}"/>`;
    g += `<text class="end-lbl" x="${X(n - 1) + 10}" y="${f.y + 4}">${esc(f.se.nome)}</text>`;
  });
  g += `<line class="guide" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" visibility="hidden"/>`;
  series.forEach(se => { g += `<circle class="hdot hov" r="4.5" cx="-20" cy="-20" style="fill:${se.cor}" visibility="hidden"/>`; });
  const colW = iw / Math.max(1, n - 1);
  labels.forEach((_, i) => {
    const t = tip(`<div class="tt">${esc(titulo(i))}</div>` + series.map(se => `<div class="tr"><span><i style="background:${se.cor}"></i>${esc(se.nome)}</span><b>${fmt(se.v[i])}</b></div>`).join(''));
    const pts = series.map(se => `${X(i).toFixed(1)},${Y(se.v[i]).toFixed(1)}`).join(';');
    g += `<rect class="hit" data-tip="${t}" data-gx="${X(i).toFixed(1)}" data-pts="${pts}" x="${X(i) - colW / 2}" y="${pad.t}" width="${colW}" height="${ih}"/>`;
  });
  const bwx = n > 1 ? iw / (n - 1) : iw;
  const passo = Math.ceil(n / Math.max(2, Math.floor(iw / 64)));
  labels.forEach((l, i) => { if (i % passo === 0) g += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });
  return `<svg width="${w}" height="${h}" role="img">${g}</svg>`;
}
function sparkline(v, { w = 112, h = 30, cor = 'var(--s1)', area = true } = {}){
  const max = Math.max(...v), min = Math.min(...v), n = v.length;
  const X = i => 2 + i / (n - 1) * (w - 6), Y = x => 3 + (h - 6) - (x - min) / ((max - min) || 1) * (h - 6);
  const d = v.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${area ? `<path d="${d}L${X(n - 1)},${h}L${X(0)},${h}Z" style="fill:${cor};opacity:.12"/>` : ''}
    <path d="${d}" style="fill:none;stroke:${cor};stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/>
    <circle cx="${X(n - 1)}" cy="${Y(v[n - 1])}" r="2.6" style="fill:${cor}"/></svg>`;
}
function hbarras(items, { fmt = mz, cor = 'var(--s1)', sub } = {}){
  const max = Math.max(...items.map(i => i.v)) || 1;
  return `<div class="hb">${items.map(it => `<div class="hb-row" data-tip="${tip(`<div class="tt">${esc(it.l)}</div>${it.tip || fmt(it.v)}`)}">
      <span class="lb">${esc(it.l)}${it.s ? `<small>${esc(it.s)}</small>` : ''}</span>
      <span class="hb-track"><i style="width:${Math.max(1.5, it.v / max * 100)}%;background:${it.cor || cor}"></i></span>
      <span class="v">${fmt(it.v)}${it.vs ? `<small>${esc(it.vs)}</small>` : ''}</span></div>`).join('')}</div>`;
}
const legenda = series => `<div class="legend">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`;

/* ---------- totais (respeitam a unidade escolhida) ---------- */
function totais(){
  const rows = UTM.filter(noUn), camps = CAMPANHAS.filter(c => noUn(c) && c.estado !== 'Terminada');
  const t = { ses:soma(rows, 'ses'), leads:soma(rows, 'leads'), op:soma(rows, 'op'), vendas:soma(rows, 'vendas'), rec:soma(rows, 'rec'),
              gasto:soma(camps, 'gasto'), alcance:soma(CONTAS.filter(noUn), 'alcance') };
  const pagas = rows.filter(r => r.med === 'paid_social');
  t.leadsPagos = soma(pagas, 'leads'); t.recPaga = soma(pagas, 'rec');
  t.qual = Math.round(t.leads * .378);
  t.cpl = t.leadsPagos ? t.gasto / t.leadsPagos : 0; t.roas = t.gasto ? t.recPaga / t.gasto : 0;
  t.conv = t.leads ? t.vendas / t.leads * 100 : 0;
  return t;
}
function porOrigem(){
  const rows = UTM.filter(noUn);
  return Object.entries(ORIGENS).map(([k, o], i) => ({ id:k, nome:o.nome, cor:o.cor, v:espalhar(soma(rows.filter(r => r.orig === k), 'leads'), 30, 11 + i * 7) }))
    .filter(s => s.v.some(Boolean));
}
function statsCampanha(c){
  if (c.hist) return c.hist;

  return { ses:soma(rows, 'ses'), leads:soma(rows, 'leads'), op:soma(rows, 'op'), vendas:soma(rows, 'vendas'), rec:soma(rows, 'rec') };
}

function vConstrutor(f){

  const painel = `<section class="card" style="position:sticky;top:84px">
    <div class="card-h"><div><h2>Pergunta ${campos.indexOf(sel) + 1}</h2><p>${esc(sel.tipo)}</p></div></div>

      ${ops.length ? `<div class="field"><span>${regra ? 'Opções e pontos' : 'Opções'}</span>${ops.map((o, i) => `<div class="opt"><input class="inp" id="op${i}" value="${esc(o[0])}" aria-label="Opção ${i + 1}">${o[1] != null ? `<input class="inp num" id="pt${i}" value="${o[1] > 0 ? '+' : ''}${o[1]}" aria-label="Pontos" style="text-align:right">` : '<span></span>'}</div>`).join('')}</div>` : ''}
      ${regra ? `<div class="note verde">${ic('target', 'sm')}<span>Conta para o critério <b>${esc(regra.nome)}</b> da qualificação.</span></div>` : ''}
      <label class="check"><input type="checkbox" id="fObrig" ${sel.obrig ? 'checked' : ''}>Resposta obrigatória</label>
    </div></section>`;
  const partilhar = `<div class="grid g-1-1">
    ${card('Link do formulário', 'Um link por canal: o UTM diz de onde veio cada resposta.', ['instagram', 'facebook', 'tiktok', 'whatsapp'].map((s, i) => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><div class="utm" style="flex:1" id="fl${i}">https://kingdomcompny.com/aplicar?p=founders&amp;<em>utm_source</em>=${s}&amp;<em>utm_medium</em>=social</div><button class="btn sm" data-act="copiar" data-alvo="fl${i}">${ic('copy', 'xs')}</button></div>`).join(''))}

  </div>`;
  return `${pageH(esc(f.nome), `${esc(unNome(f.un))} · ${f.perguntas} perguntas · uma pergunta por ecrã`,
      `<button class="btn" data-act="preview">${ic('eye', 'sm')}Pré-visualizar</button><button class="btn primary" data-act="toast" data-msg="Alterações publicadas. O link não muda.">${ic('check', 'sm')}Publicar</button>`,
      `<button class="crumb" data-act="fecharForm">${ic('left', 'xs')}Formulários</button>`)}
  <div class="seg">${[['perguntas', 'Perguntas'], ['partilhar', 'Partilhar'], ['respostas', 'Respostas']].map(([k, n]) => `<button class="${S.formTab === k ? 'on' : ''}" data-act="formTab" data-v="${k}">${n}</button>`).join('')}</div>
  ${S.formTab === 'partilhar' ? partilhar : S.formTab === 'respostas' ? card('Respostas', `${mz(f.resp)} respostas · ${f.concl ? pct(f.concl, 0) : '—'} de conclusão`,
      hbarras(campos.filter(c => !c.oculto).slice(0, 9).map((c, i) => ({ l:c.titulo, v:Math.round(f.resp * (1 - i * .033)), vs:'responderam' }))) + '<p class="muted" style="font-size:12.5px;margin-top:12px">Onde as pessoas desistem: a maior quebra está na pergunta do faturamento.</p>') : `

    <div class="qs">${campos.map((c, i) => `<button class="q ${c.k === sel.k ? 'on' : ''}" data-act="campo" data-v="${c.k}">

function historico(l){
  const h = [];
  if (l.anuncio) h.push({ ic:'mega', t:'Clicou num anúncio', p:l.fonte + ' · há 6 dias' });
  if (l.precos) h.push({ ic:'eye', t:'Visitou a página de preços', p:'kingdomcompny.com/founders · há 5 dias' });
  if (l.form) h.push({ ic:'form', t:'Preencheu um formulário', p:l.fonte.startsWith('Formulário') ? l.fonte.replace('Formulário · ', '') : 'Aplicação — Kingdom Training', c:'azul' });
  if (l.inbox) h.push({ ic:l.canal, t:'Conversa no ' + (CANAIS[l.canal] || 'Inbox'), p:'Respondeu em 7 minutos' });
  if (['qualificado', 'oportunidade', 'cliente'].includes(l.estado)) h.push({ ic:'target', t:'Qualificado automaticamente', p:`Score ${l.score} · responsável ${l.resp}`, c:'azul' });
  if (l.op) h.push({ ic:'wallet', t:'Oportunidade criada no Payflow', p:`${l.op} · etapa ${l.etapa || 'Qualificado'}`, c:'azul' });
  if (l.pago) h.push({ ic:'check', t:'Pagamento confirmado pelo Payflow', p:`${dinheiro(l.pago)} · order.paid`, c:'verde' });
  if (l.estado === 'desqualificado') h.push({ ic:'x', t:'Desqualificado', p:l.motivo });
  return h.reverse();
}

      ${ops.length ? ops.map((o, k) => `<button class="po ${k === 3 ? 'on' : ''}">${esc(o)}</button>`).join('') : `<input class="inp" style="background:#fff;color:#0E1726;border-color:#CCD5E2" placeholder="Escreva aqui" aria-label="Resposta">`}
      <div style="margin-top:auto;display:flex;gap:8px"><button class="btn" data-act="pvAnt" style="background:#fff;color:#0E1726;border-color:#CCD5E2">Voltar</button><button class="btn primary" data-act="pvSeg" style="flex:1;justify-content:center">Continuar</button></div>`; };
  layer(`<div class="modal-w"><div class="scrim" data-act="fechar"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Pré-visualização"><div class="modal-h"><div><h2>Pré-visualização</h2><p>Como aparece no telemóvel de quem responde.</p></div><button class="icon-btn x" data-act="fechar" aria-label="Fechar">${ic('x', 'sm')}</button></div>
    <div class="modal-b"><div class="phone" id="phone"></div></div></div></div>`);
  window._pv = { seg:() => { i = Math.min(ecras.length - 1, i + 1); pinta(); }, ant:() => { i = Math.max(0, i - 1); pinta(); } }; pinta();
}
function novaCampanha(){
  layer(`<div class="modal-w"><div class="scrim" data-act="fechar"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ncT">
    <div class="modal-h"><div><h2 id="ncT">Nova campanha</h2><p>Uma campanha junta publicações, anúncios e links com o mesmo <span class="mono">utm_campaign</span>.</p></div><button class="icon-btn x" data-act="fechar" aria-label="Fechar">${ic('x', 'sm')}</button></div>
    <div class="modal-b">
      <label class="field"><span>Nome</span><input id="ncNome" value="Founders — Turma Novembro"></label>
      <div class="row"><label class="field"><span>Unidade</span><select id="ncUn">${UNIDADES.map(u => `<option value="${u.id}" ${S.un === u.id ? 'selected' : ''}>${u.nome}</option>`).join('')}</select></label>
        <label class="field"><span>Objetivo</span><select id="ncObj"><option>Vendas</option><option>Leads</option><option>Inscrições</option><option>Notoriedade</option></select></label></div>
      <div class="row"><label class="field"><span>Início</span><input type="date" id="ncIni" value="2026-10-16"></label><label class="field"><span>Fim</span><input type="date" id="ncFim" value="2026-11-15"></label>
        <label class="field"><span>Orçamento (MZ)</span><input id="ncOrc" inputmode="numeric" value="180 000"></label></div>
      <div class="field"><span>Canais</span><div class="chips">${Object.entries(REDES).map(([k, r], i) => `<button class="chip ${i < 3 ? 'on' : ''}" data-act="toggleChip">${net(k, 'xs')}${r.nome}</button>`).join('')}</div></div>
      <div class="field"><span>Identificador UTM</span><div class="utm" id="ncUtm"><em>utm_campaign</em>=founders-turma-novembro</div><small>Gerado a partir do nome. É o que liga os leads e as vendas a esta campanha.</small></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="fechar">Cancelar</button><button class="btn primary" data-act="criarCampanha">${ic('check', 'sm')}Criar campanha</button></div></div></div>`);
}
function layer(html){ $('#layer').innerHTML = html; document.body.style.overflow = 'hidden'; setTimeout(() => { const f = $('#layer [data-act="fechar"].icon-btn, #layer .x'); f && f.focus(); }, 30); }
function fecharLayer(){ $('#layer').innerHTML = ''; document.body.style.overflow = ''; S.lead = null; }
let toastT;
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.innerHTML = ic('check', 'sm') + esc(msg);
  $$('.toast').forEach(t => t.remove()); document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3600);
}

/* =====================================================================
   DESENHO E EVENTOS
   ===================================================================== */
const VISTAS = { visao:vVisao, publicacoes:vPublicacoes, campanhas:vCampanhas, metricas:vMetricas, conversas:vConversas, leads:vLeads, formularios:vFormularios, integracoes:vIntegracoes, design:vDesign };
function nav(){
  $('#nav').innerHTML = ROTAS.map(r => r.sep ? `<div class="nav-lbl">${r.sep}</div>`
    : `<a href="#${r.id}" class="${S.rota === r.id ? 'on' : ''}" ${S.rota === r.id ? 'aria-current="page"' : ''}>${ic(r.ic)}${r.nome}${r.count && r.count() ? `<span class="count">${r.count()}</span>` : ''}</a>`).join('');
  const u = UNIDADES.find(x => x.id === S.un);
  $('#unitName').textContent = u ? u.nome : 'Todas as unidades'; $('#unitDot').textContent = u ? u.sigla : 'K';
}
function render(manterScroll){
  TIPS = []; CH = {}; esconderTip();
  const y = window.scrollY;
  $('#page').innerHTML = (VISTAS[S.rota] || vVisao)();
  nav(); desenharGraficos(); atualizarUTM();
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  if (manterScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if (S.lead) abrirLead(S.lead);
  const back = $('#ibBack'); if (back && innerWidth <= 960) back.style.display = 'grid';
}
function rota(){
  const h = location.hash.replace('#', '');
  S.rota = VISTAS[h] ? h : 'visao';
  $('#app').classList.remove('nav-open');
  render();
}

const ACOES = {
  unitMenu(el){
    const existe = $('#unitMenu'); if (existe){ existe.remove(); return; }
    const r = el.getBoundingClientRect(); const m = document.createElement('div'); m.className = 'menu'; m.id = 'unitMenu';
    m.style.left = r.left + 'px'; m.style.top = (r.bottom + 6 + window.scrollY) + 'px'; m.style.width = Math.max(236, r.width) + 'px';
    m.innerHTML = `<button data-act="unidade" data-v="todas" class="${S.un === 'todas' ? 'on' : ''}"><span class="unit-dot">K</span>Todas as unidades</button><hr>`
      + UNIDADES.map(u => `<button data-act="unidade" data-v="${u.id}" class="${S.un === u.id ? 'on' : ''}"><span class="unit-dot">${u.sigla}</span>${u.nome}</button>`).join('')
      + `<hr><button data-act="toast" data-msg="Fase 2: outros negócios, cada um com as suas contas, equipa e ligação ao Payflow.">${ic('plus', 'sm')}Adicionar negócio</button>`;
    document.body.appendChild(m);
  },
  unidade(el){ S.un = el.dataset.v; $('#unitMenu')?.remove(); S.camp = null; render(true); toast('A mostrar: ' + unNome(S.un)); },
  openNav(){ $('#app').classList.add('nav-open'); },
  closeNav(){ $('#app').classList.remove('nav-open'); },
  periodo(el){ $$('#periodo button').forEach(b => b.classList.toggle('on', b === el)); toast(`No protótipo, os números mostram sempre 30 dias.`); },
  theme(){
    const r = document.documentElement; const escuro = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = escuro ? 'light' : 'dark'; try { localStorage.setItem('tracktor-tema', r.dataset.theme); } catch (e) {}
    desenharGraficos();
  },
  notif(){ toast('3 novidades: 2 leads quentes e 1 publicação que falhou.'); },
  toast(el){ toast(el.dataset.msg); },
  fechar(){ fecharLayer(); },
  compor(el){ compor(el.dataset.dia ? +el.dataset.dia : null); },
  cpConta(el){ el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); atualizarCompositor(); },
  cpRede(el){ S.cpRede = el.dataset.v; atualizarCompositor(); },
  cpGuardar(){ fecharLayer(); toast('Rascunho guardado.'); },
  cpAgendar(){
    const cs = contasEscolhidas(); if (!cs.length){ toast('Escolha pelo menos uma conta.'); return; }
    const d = new Date($('#cpData').value + 'T12:00'); const dia = d.getDate(); const aprov = $('#cpAprov').checked;
    if (d.getMonth() === 8 && dia >= 21 && dia <= 27) POSTS.push({ id:Date.now(), d:dia, h:$('#cpHora').value, redes:[...new Set(cs.map(c => c.rede))], un:cs[0].un,
      titulo:$('#cpTxt').value.split('\n')[0].slice(0, 70), estado:aprov ? 'aprovacao' : 'agendada' });
    fecharLayer(); toast(`${aprov ? 'Enviada para aprovação' : 'Agendada'}: ${fDiaLongo(d)} às ${$('#cpHora').value}.`);
    if (S.rota === 'publicacoes') render(true); else location.hash = 'publicacoes';
  },
  calVista(el){ S.calVista = el.dataset.v; render(true); },
  calRede(el){ const k = el.dataset.v; S.calRedes = S.calRedes.includes(k) ? S.calRedes.filter(x => x !== k) : [...S.calRedes, k]; render(true); },
  verPost(el){
    const p = POSTS.find(x => x.id === +el.dataset.id);
    if (p.estado === 'publicada') toast(`${p.titulo.split(':')[0]}: alcance ${mz(p.alcance)} pessoas.`); else compor(p.d);
  },
  aprovar(el){ const p = POSTS.find(x => x.id === +el.dataset.id); p.estado = 'agendada'; render(true); toast('Aprovada. Sai à hora marcada.'); },
  reconectar(){ POSTS.filter(p => p.estado === 'falhou').forEach(p => { p.estado = 'agendada'; p.d = 26; p.h = '20:00'; }); render(true); toast('TikTok ligado de novo. A publicação que falhou foi reagendada para amanhã às 20:00.'); },
  abrirCamp(el){ S.camp = el.dataset.id; render(); },
  fecharCamp(){ S.camp = null; render(); },
  novaCampanha(){ novaCampanha(); },
  criarCampanha(){ fecharLayer(); toast('Campanha criada. Os links com UTM já estão prontos.'); },
  toggleChip(el){ el.classList.toggle('on'); },
  metrTab(el){ S.metr = el.dataset.v; if (S.rota !== 'metricas'){ location.hash = 'metricas'; return; } render(true); },
  atrib(el){ S.atrib = el.dataset.v; render(true); },
  utmDim(el){ S.utmDim = el.dataset.v; render(true); },
  copiar(el){
    const alvo = $('#' + el.dataset.alvo); const txt = alvo.textContent.replace(/\s+/g, '');
    const ok = () => toast('Link copiado.');
    try { navigator.clipboard.writeText(txt).then(ok, () => { selecionar(alvo); toast('Link selecionado: copie com Ctrl+C.'); }); } catch (e) { selecionar(alvo); }
  },
  abrirConv(el){ S.conv = +el.dataset.id; S.ibPane = 'thread'; const c = CONVERSAS.find(x => x.id === S.conv); if (c) c.nao = 0; fecharLayer();
    if (S.rota !== 'conversas') location.hash = 'conversas'; else render(true); },
  ibFiltro(el){ S.ibFiltro = el.dataset.v; render(true); },
  ibPane(el){ S.ibPane = el.dataset.v; const ib = $('#inbox'); if (innerWidth > 960 && el.dataset.v === 'side'){ ib.classList.toggle('show-side'); return; } render(true); },
  resolver(el){ const c = CONVERSAS.find(x => x.id === +el.dataset.id); c.estado = c.estado === 'resolvida' ? 'aberta' : 'resolvida'; c.nao = 0; render(true); toast(c.estado === 'resolvida' ? 'Conversa resolvida.' : 'Conversa reaberta.'); },
  resposta(el){
    const t = { 'Datas da turma':'A Turma Outubro começa a 20 de outubro. As aulas são às terças e quintas, das 18h às 20h.',
      'Formas de pagamento':'Pode pagar por M-Pesa, transferência BIM ou cartão. O link de pagamento chega-lhe pelo Payflow.',
      'Link da aplicação':'Pode candidatar-se aqui: kingdomcompny.com/aplicar?p=founders',
      'Marcar reunião':'Que tal uma conversa de 20 minutos? Tenho disponibilidade na terça às 10h ou na quarta às 15h.' }[el.dataset.v];
    const ta = $('#rTxt'); ta.value = t; ta.focus();
  },
  enviarMsg(el){
    const ta = $('#rTxt'); const t = ta.value.trim(); if (!t){ ta.focus(); return; }
    const c = CONVERSAS.find(x => x.id === +el.dataset.id); c.msgs.push({ s:'eu', t, h:'18:31', q:'Shelton' }); c.quando = '18:31'; c.nao = 0; render(true);
  },
  abrirLead(el){ abrirLead(+el.dataset.id); },
  leadsTab(el){ S.leadsTab = el.dataset.v; render(true); },
  leadsVista(el){ S.leadsVista = el.dataset.v; render(true); },
  leadsFiltro(el){ S.leadsFiltro = el.dataset.v; render(true); },
  qualificar(el){ const l = LEADS.find(x => x.id === +el.dataset.id); l.estado = 'qualificado'; render(true); abrirLead(l.id); toast(`${l.nome} está qualificado. Já pode seguir para o pipeline.`); },
  reativar(el){ const l = LEADS.find(x => x.id === +el.dataset.id); l.estado = 'qualificacao'; l.semorc = false; l.score = pontuacao(l); render(true); abrirLead(l.id); toast('Lead reativado.'); },
  enviarPayflow(el){ enviarPayflow(+el.dataset.id); },
  confirmarPayflow(el){
    const l = LEADS.find(x => x.id === +el.dataset.id); l.estado = 'oportunidade'; l.op = 'OP-' + (2291 + LEADS.filter(x => x.op).length);
    l.etapa = $('#mpEtapa').value; l.resp = $('#mpResp').value; l.oferta = $('#mpOferta').value;
    fecharLayer(); render(true); abrirLead(l.id); toast(`Oportunidade ${l.op} criada no Payflow, na etapa ${l.etapa}.`);
  },
  abrirForm(el){ S.form = el.dataset.id; S.formTab = 'perguntas'; render(); },
  fecharForm(){ S.form = null; render(); },
  formTab(el){ S.formTab = el.dataset.v; render(true); },
  campo(el){ S.campoSel = el.dataset.v; render(true); },
  preview(){ preview(); },
  pvSeg(){ window._pv.seg(); }, pvAnt(){ window._pv.ant(); }
};
function selecionar(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!e.target.closest('#unitMenu') && !e.target.closest('#unitBtn')) $('#unitMenu')?.remove();
  if (!a) return;
  const act = a.dataset.act; if (!ACOES[act]) return;
  if (a.tagName === 'A' && a.getAttribute('href')?.startsWith('#') && ['abrirConv', 'metrTab'].includes(act)) e.preventDefault();
  e.stopPropagation(); ACOES[act](a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#layer').innerHTML) fecharLayer(); $('#unitMenu')?.remove(); $('#app').classList.remove('nav-open'); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'rTxt') $('[data-act="enviarMsg"]')?.click();
});
document.addEventListener('input', e => {
  if (e.target.closest('#layer') && (e.target.id === 'cpTxt')) atualizarCompositor();
  if (['uUrl', 'uCont'].includes(e.target.id)) atualizarUTM();
  if (e.target.id === 'ncNome') $('#ncUtm').innerHTML = '<em>utm_campaign</em>=' + slug(e.target.value);
  if (e.target.id === 'busca' && S.rota === 'leads'){ render(true); const b = $('#busca'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
});
document.addEventListener('change', e => {
  if (['uSrc', 'uMed', 'uCamp'].includes(e.target.id)) atualizarUTM();
  if (e.target.id === 'cpCamp') atualizarCompositor();
  if (e.target.id === 'cpMedia' && e.target.files[0]) $('#cpMediaTxt').innerHTML = `<b style="font-weight:500;color:var(--ink)">${esc(e.target.files[0].name)}</b><br>Pronto a publicar`;
  if (e.target.dataset.change === 'ibCanal'){ S.ibCanal = e.target.value; render(true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'busca' && S.rota !== 'leads'){ location.hash = 'leads'; } });

/* ---------- dica flutuante dos gráficos ---------- */
const TIP = $('#tip');
function esconderTip(){ TIP.hidden = true; $$('.chart .guide, .chart .hov').forEach(g => g.setAttribute('visibility', 'hidden')); }
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]');
  if (!t){ if (!TIP.hidden) esconderTip(); return; }
  TIP.innerHTML = TIPS[+t.dataset.tip] || ''; TIP.hidden = false;
  const w = TIP.offsetWidth, h = TIP.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  TIP.style.left = Math.max(8, x) + 'px'; TIP.style.top = Math.max(8, y) + 'px';
  const svg = t.closest('svg');
  if (svg && t.dataset.gx){
    const g = svg.querySelector('.guide'); g.setAttribute('x1', t.dataset.gx); g.setAttribute('x2', t.dataset.gx); g.setAttribute('visibility', 'visible');
    const pts = t.dataset.pts.split(';'); svg.querySelectorAll('.hov').forEach((c, i) => { const [cx, cy] = pts[i].split(','); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('visibility', 'visible'); });
  }
});
document.addEventListener('pointerleave', esconderTip);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { TIPS = []; desenharGraficos(); }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', desenharGraficos);

try { const t = localStorage.getItem('tracktor-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
